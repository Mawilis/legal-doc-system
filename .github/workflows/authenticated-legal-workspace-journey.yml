name: Authenticated Legal Workspace Journey

on:
  pull_request:
    paths:
      - "client/src/App.jsx"
      - "client/src/components/crm/CRMDashboard.jsx"
      - "client/src/components/crm/OwnerCommercialWorkspace.jsx"
      - "client/src/components/crm/OwnerCommercialWorkspace.module.css"
      - "client/src/services/ownerCommercialWorkspaceService.js"
      - "client/vite.config.js"
      - "client/src/contexts/authContext.jsx"
      - "client/src/services/api.js"
      - "client/src/components/sovereign/SovereignDashboardController.jsx"
      - "client/src/__tests__/services/api.test.js"
      - "client/tests/client/SovereignDashboardController.test.js"
      - "tools/eos/auth/workspace_contract.py"
      - "tools/eos/auth/workspace_bootstrap_projection.py"
      - "tools/eos/api/auth_router.py"
      - "tests/unit/test_workspace_contract.py"
      - "tests/unit/test_workspace_bootstrap_projection.py"
      - "client/src/contexts/tenantContext.jsx"
      - "client/tests/client/App.authenticatedLegalWorkspaceJourney.test.jsx"
      - "client/tests/client/App.legalAcceptanceBarrier.test.jsx"
      - "client/tests/contexts/authContext.authoritative.test.jsx"
      - "client/tests/components/auth/TenantIdentityPremium.test.jsx"
      - ".github/workflows/authenticated-legal-workspace-journey.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authenticated-legal-workspace:
    name: Browser auth, tenant bootstrap and Legal admission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install locked client dependencies
        run: npm ci

      - name: Test authenticated Legal workspace journey
        run: >-
          npx vitest run --config vitest.config.js
          tests/client/App.authenticatedLegalWorkspaceJourney.test.jsx
          tests/client/App.legalAcceptanceBarrier.test.jsx
          tests/contexts/authContext.authoritative.test.jsx
          tests/components/auth/TenantIdentityPremium.test.jsx
          src/__tests__/services/api.test.js
          tests/client/SovereignDashboardController.test.js

      - name: Verify client production build
        run: npm run build

  eos-workspace-contract:
    name: Python EOS workspace contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install EOS test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.1.1
      - name: Compile workspace contract
        run: |
          python -m py_compile \
            tools/eos/auth/workspace_contract.py \
            tools/eos/auth/workspace_bootstrap_projection.py \
            tools/eos/api/auth_router.py
      - name: Run workspace authority tests
        run: |
          python -m pytest -q \
            tests/unit/test_workspace_contract.py \
            tests/unit/test_workspace_bootstrap_projection.py
