# ============================================================================
# WILSY OS 2050 - UNIFIED PRODUCTION CI/CD INFRASTRUCTURE
# RETAINED/SOVEREIGN PRODUCTION GATES | HARDENED REFUGE GATEWAY | INVESTOR-GRADE
# Now with Frontend Sovereign Tests (BusinessContext & Cross‑Dashboard)
# ============================================================================

name: 🏛️ WILSY OS 2050 Unified Pipeline

on:
  push:
    branches: [main, master, develop, production]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: "20.x"
  NODE_ENV: test

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  security-scan:
    name: 🕵️ Security & Quantum Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Run retained production lint
        run: |
          ./node_modules/.bin/eslint \
            server.js \
            controllers/businessArtifactPdfController.js \
            services/artifacts/wilsyEnterprisePdfRenderer.js \
            services/qr/qrGenerator.js
      - name: Run retained production secret guard
        working-directory: .
        run: |
          node scripts/wilsy-secret-guard.js \
            server/server.js \
            server/controllers/businessArtifactPdfController.js \
            server/services/artifacts/wilsyEnterprisePdfRenderer.js \
            server/services/qr/qrGenerator.js \
            scripts/wilsy-secret-guard.js

  # Legacy server enterprise matrix is intentionally excluded from
  # production certification until separately classified RETAIN/SOVEREIGN.

  # ─── R2A: Vendor Bill Real-Mongo Certification ─────────────────────────
  vendor-bill-r2a-certification:
    name: 🧾 R2A Vendor Bill Real-Mongo Certification
    runs-on: ubuntu-latest
    needs: [security-scan]
    env:
      TEST_VENDOR_MONGO_URI: mongodb://localhost:27017/?replicaSet=wilsyVendorCertRS
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Create Python certification environment
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip==25.3
          .ci-venv/bin/python -m pip install \
            pymongo==4.16.0 \
            pytest==9.1.1 \
            pydantic==2.13.4 \
            pydantic_core==2.46.4 \
            python-dotenv==1.2.3

      - name: Start MongoDB replica-set container
        run: |
          docker run \
            --detach \
            --name wilsy-vendor-cert-mongo \
            --publish 27017:27017 \
            mongo:7.0.37 \
            mongod \
            --replSet wilsyVendorCertRS \
            --bind_ip_all

      - name: Initialize MongoDB replica set
        run: |
          .ci-venv/bin/python - <<'PY'
          import time

          from pymongo import MongoClient

          client = MongoClient(
              "mongodb://localhost:27017",
              directConnection=True,
              serverSelectionTimeoutMS=2_000,
          )

          deadline = time.monotonic() + 60
          initiated = False
          last_error = None

          while True:
              try:
                  hello = client.admin.command("hello")

                  if not initiated and not hello.get("setName"):
                      client.admin.command(
                          {
                              "replSetInitiate": {
                                  "_id": "wilsyVendorCertRS",
                                  "members": [
                                      {
                                          "_id": 0,
                                          "host": "localhost:27017",
                                      }
                                  ],
                              }
                          }
                      )
                      initiated = True

                  if client.admin.command("hello").get(
                      "isWritablePrimary"
                  ):
                      break

              except Exception as exc:
                  last_error = exc

              if time.monotonic() >= deadline:
                  raise RuntimeError(
                      "CI_VENDOR_MONGO_REPLICA_SET_UNAVAILABLE: "
                      f"{last_error!r}"
                  ) from last_error

              time.sleep(1)

          client.close()
          PY

      - name: Compile R2A Python contracts
        run: |
          .ci-venv/bin/python -m py_compile \
            tools/eos/saas/domain/vendor_bill.py \
            tools/eos/saas/billing/vendor_bill_registry.py \
            tests/integration/test_vendor_bill_registry_mongo.py \
            tests/integration/test_vendor_bill_release_authorization_registry_mongo.py

      - name: Type-check R2A contracts
        run: |
          npx --yes pyright@1.1.413 \
            --pythonpath .ci-venv/bin/python \
            tools/eos/saas/domain/vendor_bill.py \
            tools/eos/saas/billing/vendor_bill_registry.py \
            tests/integration/test_vendor_bill_registry_mongo.py \
            tests/integration/test_vendor_bill_release_authorization_registry_mongo.py

      - name: Run R2A real-Mongo certification
        run: |
          .ci-venv/bin/python -m pytest -q \
            tests/integration/test_vendor_bill_registry_mongo.py \
            tests/integration/test_vendor_bill_command_registry_mongo.py \
            tests/integration/test_financial_approval_effective_result_registry_mongo.py \
            tests/integration/test_financial_approval_aggregator_mongo.py \
            tests/integration/test_vendor_bill_release_authorization_registry_mongo.py

      - name: Stop MongoDB certification container
        if: always()
        run: |
          docker rm -f wilsy-vendor-cert-mongo 2>/dev/null || true

  vendor-bill-r2b-release-certification:
    name: 💸 R2B Vendor Bill Release Real-Mongo Certification
    runs-on: ubuntu-latest
    needs: [security-scan]
    env:
      TEST_VENDOR_MONGO_URI: mongodb://localhost:27017/?replicaSet=wilsyVendorCertRS
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Create Python certification environment
        run: |
          python3 -m venv .ci-r2b-venv
          .ci-r2b-venv/bin/python -m pip install --upgrade pip==25.3
          .ci-r2b-venv/bin/python -m pip install pymongo==4.16.0 pytest==9.1.1 pydantic==2.13.4 pydantic_core==2.46.4 python-dotenv==1.2.3
      - name: Start MongoDB replica set
        run: |
          docker run \
            --detach \
            --name wilsy-vendor-r2b-cert-mongo \
            --publish 27017:27017 \
            mongo:7.0.37 \
            mongod \
            --replSet wilsyVendorCertRS \
            --bind_ip_all
      - name: Initialize MongoDB replica set
        run: |
          .ci-r2b-venv/bin/python - <<'PY'
          import time
          from pymongo import MongoClient
          c=MongoClient('mongodb://localhost:27017',directConnection=True,serverSelectionTimeoutMS=2000); deadline=time.monotonic()+60; initiated=False
          while True:
              try:
                  h=c.admin.command('hello')
                  if not initiated and not h.get('setName'):
                      c.admin.command({'replSetInitiate':{'_id':'wilsyVendorCertRS','members':[{'_id':0,'host':'localhost:27017'}]}}); initiated=True
                  if c.admin.command('hello').get('isWritablePrimary'): break
              except Exception as e: last=e
              if time.monotonic()>=deadline: raise RuntimeError(f'CI_VENDOR_MONGO_REPLICA_SET_UNAVAILABLE: {last!r}')
              time.sleep(1)
          c.close()
          PY
      - name: Compile R2B contracts
        run: |
          .ci-r2b-venv/bin/python -m py_compile \
            tools/eos/saas/billing/vendor_bill_release_orchestrator.py \
            tests/unit/test_vendor_bill_release_orchestrator.py \
            tests/integration/test_vendor_bill_release_orchestrator_mongo.py
      - name: Type-check R2B contracts
        run: npx --yes pyright@1.1.413 --pythonpath .ci-r2b-venv/bin/python tools/eos/saas/billing/vendor_bill_release_orchestrator.py tests/unit/test_vendor_bill_release_orchestrator.py tests/integration/test_vendor_bill_release_orchestrator_mongo.py
      - name: Run R2B real-Mongo certification
        run: |
          .ci-r2b-venv/bin/python -m pytest --collect-only -q tests/integration/test_vendor_bill_release_orchestrator_mongo.py
          integration_output="$(${CI_PROJECT_DIR:-.}/.ci-r2b-venv/bin/python -m pytest -q tests/integration/test_vendor_bill_release_orchestrator_mongo.py)"
          printf '%s\n' "$integration_output"
          printf '%s\n' "$integration_output" | grep -Eq '(^|[ =])14 passed([, =]|$)'
          if printf '%s\n' "$integration_output" | grep -q 'skipped'; then
            echo "R2B certification invalid: skipped tests detected"
            exit 1
          fi
          .ci-r2b-venv/bin/python -m pytest -q tests/unit/test_vendor_bill_release_orchestrator.py
      - name: Stop MongoDB certification container
        if: always()
        run: docker rm -f wilsy-vendor-r2b-cert-mongo 2>/dev/null || true

  # Broad client certification is excluded from production CI until
  # its runtime surface is separately classified RETAIN/SOVEREIGN.

  # Final governed production gate
  final-verification:
    name: ✅ Retained Production Gates Passed
    runs-on: ubuntu-latest
    needs:
      [
        security-scan,
        vendor-bill-r2a-certification,
        vendor-bill-r2b-release-certification,
      ]
    if: always()
    steps:
      - name: Check retained production gate status
        run: |
          echo "Retained and sovereign production gates have completed."
          if [ "${{ needs.security-scan.result }}" != "success" ] || \
             [ "${{ needs.vendor-bill-r2a-certification.result }}" != "success" ] || \
             [ "${{ needs.vendor-bill-r2b-release-certification.result }}" != "success" ]; then
            echo "❌ A retained or sovereign production gate failed."
            exit 1
          fi
          echo "✅ All retained and sovereign production gates passed."
