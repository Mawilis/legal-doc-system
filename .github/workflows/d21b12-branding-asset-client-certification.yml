name: D21B12 Authenticated Branding Asset Client Certification

on:
  push:
    branches:
      - legal-ops-completion-map
    paths:
      - "client/src/services/tenantBrandingAssetClient.js"
      - "client/src/hooks/useAuthenticatedTenantBrandingAsset.js"
      - "client/tests/services/tenantBrandingAssetClient.test.js"
      - "client/tests/hooks/useAuthenticatedTenantBrandingAsset.test.jsx"
      - "client/src/components/os/WilsyOSDashboardChrome.jsx"
      - "client/src/components/os/WilsyOSDashboardTopRail.jsx"
      - ".github/workflows/d21b12-branding-asset-client-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d21b12-client:
    name: D21B12 blob client and presentation lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install exact client dependencies
        working-directory: client
        run: npm ci
      - name: Run exact D21B12 transport certificate
        working-directory: client
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output="$(npm run test:run -- tests/services/tenantBrandingAssetClient.test.js 2>&1)"
          test_status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          printf '%s\n' "$output" | grep -Eq '10 passed'
          if printf '%s\n' "$output" | grep -Eqi '[1-9][0-9]* skipped|skipped \([1-9]'; then
            echo "D21B12 transport certification invalid: skipped tests detected"
            exit 1
          fi
      - name: Run D21B12 lifecycle certificate when present
        working-directory: client
        shell: bash
        run: |
          if [ -f tests/hooks/useAuthenticatedTenantBrandingAsset.test.jsx ]; then
            set -uo pipefail
            set +e
            output="$(npm run test:run -- tests/hooks/useAuthenticatedTenantBrandingAsset.test.jsx 2>&1)"
            test_status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$test_status" -ne 0 ]; then
              exit "$test_status"
            fi
            if printf '%s\n' "$output" | grep -Eqi '[1-9][0-9]* skipped|skipped \([1-9]'; then
              echo "D21B12 lifecycle certification invalid: skipped tests detected"
              exit 1
            fi
          fi
      - name: Build production client
        working-directory: client
        run: npm run build
