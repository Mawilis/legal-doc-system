name: D21B4B Branding Registry Certification

on:
  push:
    branches:
      - legal-ops-completion-map
    paths:
      - "tools/eos/saas/billing/tenant_branding_profile_registry.py"
      - "tools/eos/saas/domain/tenant_branding_profile.py"
      - "tools/eos/saas/domain/tenant_branding_profile_selection.py"
      - "tools/eos/saas/domain/tenant_branding_entitlement.py"
      - "tools/eos/saas/billing/tenant_branding_vas_policy.py"
      - "tests/unit/test_tenant_branding_profile_registry.py"
      - "tests/integration/test_tenant_branding_profile_registry_real_mongo.py"
      - ".github/workflows/d21b4b-branding-registry-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d21b4b-certification:
    name: D21B4B direct, static and real-Mongo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TEST_VENDOR_MONGO_URI: mongodb://localhost:27017/?replicaSet=wilsyVendorCertRS
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node for pinned Pyright
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install bounded certification dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install             pymongo==4.16.0             pytest==9.1.1

      - name: Compile exact D21B4B surfaces
        run: |
          python -m py_compile             tools/eos/saas/billing/tenant_branding_profile_registry.py             tests/unit/test_tenant_branding_profile_registry.py             tests/integration/test_tenant_branding_profile_registry_real_mongo.py

      - name: Type-check exact D21B4B surfaces
        run: |
          npx --yes pyright@1.1.413             --pythonpath "$(command -v python)"             tools/eos/saas/billing/tenant_branding_profile_registry.py             tests/unit/test_tenant_branding_profile_registry.py             tests/integration/test_tenant_branding_profile_registry_real_mongo.py

      - name: Run exact direct certificate
        shell: bash
        run: |
          set -euo pipefail
          output="$(python -m pytest -q tests/unit/test_tenant_branding_profile_registry.py)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq '17 passed'
          if printf '%s\n' "$output" | grep -qi 'skipped'; then
            echo "D21B4B direct certification invalid: skipped tests detected"
            exit 1
          fi

      - name: Start disposable Mongo replica set
        run: |
          docker run             --detach             --name wilsy-d21b4b-cert-mongo             --publish 27017:27017             mongo:7.0.37             mongod             --replSet wilsyVendorCertRS             --bind_ip_all

      - name: Initialize Mongo replica set
        run: |
          python - <<'PY'
          import time
          from pymongo import MongoClient

          client = MongoClient(
              "mongodb://localhost:27017",
              directConnection=True,
              serverSelectionTimeoutMS=2_000,
          )
          deadline = time.monotonic() + 60
          initiated = False
          last_error = None

          while True:
              try:
                  hello = client.admin.command("hello")
                  if not initiated and not hello.get("setName"):
                      client.admin.command(
                          {
                              "replSetInitiate": {
                                  "_id": "wilsyVendorCertRS",
                                  "members": [{"_id": 0, "host": "localhost:27017"}],
                              }
                          }
                      )
                      initiated = True
                  hello = client.admin.command("hello")
                  if (
                      hello.get("setName") == "wilsyVendorCertRS"
                      and hello.get("isWritablePrimary") is True
                      and hello.get("logicalSessionTimeoutMinutes") is not None
                  ):
                      break
              except Exception as error:
                  last_error = error

              if time.monotonic() >= deadline:
                  raise RuntimeError(
                      f"D21B4B_CI_MONGO_UNAVAILABLE: {last_error!r}"
                  ) from last_error
              time.sleep(1)

          client.close()
          PY

      - name: Run exact real-Mongo certificate with no skips
        shell: bash
        run: |
          set -euo pipefail
          output="$(python -m pytest -q -rs tests/integration/test_tenant_branding_profile_registry_real_mongo.py)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Eq '9 passed'
          if printf '%s\n' "$output" | grep -qi 'skipped'; then
            echo "D21B4B real-Mongo certification invalid: skipped tests detected"
            exit 1
          fi

      - name: Stop disposable Mongo
        if: always()
        run: docker rm -f wilsy-d21b4b-cert-mongo 2>/dev/null || true
