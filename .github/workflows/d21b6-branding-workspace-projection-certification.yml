name: D21B6 Tenant Branding Workspace Projection Certification

on:
  push:
    branches:
      - legal-ops-completion-map
    paths:
      - "tools/eos/auth/tenant_branding_workspace_projection.py"
      - "tests/unit/test_tenant_branding_workspace_projection.py"
      - "tests/integration/test_tenant_branding_workspace_projection_real_mongo.py"
      - ".github/workflows/d21b6-branding-workspace-projection-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d21b6-direct:
    name: D21B6 direct and static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node for pinned Pyright
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install bounded dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install pymongo==4.16.0 pytest==9.1.1
      - name: Compile exact D21B6 surfaces
        run: |
          python -m py_compile \
            tools/eos/auth/tenant_branding_workspace_projection.py \
            tests/unit/test_tenant_branding_workspace_projection.py
      - name: Type-check exact D21B6 surfaces
        run: |
          npx --yes pyright@1.1.413 \
            --pythonpath "$(command -v python)" \
            tools/eos/auth/tenant_branding_workspace_projection.py \
            tests/unit/test_tenant_branding_workspace_projection.py
      - name: Run exact D21B6 direct certificate with no skips
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output="$(python -m pytest -q -rs tests/unit/test_tenant_branding_workspace_projection.py 2>&1)"
          pytest_status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$pytest_status" -ne 0 ]; then
            exit "$pytest_status"
          fi
          if printf '%s\n' "$output" | grep -qi 'skipped'; then
            echo "D21B6 direct certification invalid: skipped tests detected"
            exit 1
          fi
