name: D21B7 Workspace Branding HTTP Projection Certification

on:
  push:
    branches:
      - legal-ops-completion-map
    paths:
      - "tools/eos/api/auth_router.py"
      - "tests/unit/test_workspace_branding_http_projection.py"
      - "tests/unit/test_canonical_access_token_contract.py"
      - ".github/workflows/d21b7-workspace-branding-http-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d21b7-http:
    name: D21B7 HTTP projection direct and static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node for pinned Pyright
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Create bounded Python environment
        run: |
          python -m venv .d21b7-venv
          .d21b7-venv/bin/python -m pip install --upgrade pip==25.3
          .d21b7-venv/bin/python -m pip install -r requirements.txt
          .d21b7-venv/bin/python -m pip install pytest==9.1.1 pyotp==2.9.0
      - name: Compile exact D21B7 surfaces
        run: |
          .d21b7-venv/bin/python -m py_compile \
            tools/eos/api/auth_router.py \
            tests/unit/test_workspace_branding_http_projection.py \
            tests/unit/test_canonical_access_token_contract.py
      - name: Type-check exact D21B7 surfaces
        run: |
          npx --yes pyright@1.1.413 \
            --pythonpath .d21b7-venv/bin/python \
            tools/eos/api/auth_router.py \
            tests/unit/test_workspace_branding_http_projection.py
      - name: Run exact D21B7 direct certificate with no skips
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output="$(.d21b7-venv/bin/python -m pytest -q -rs tests/unit/test_workspace_branding_http_projection.py 2>&1)"
          pytest_status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$pytest_status" -ne 0 ]; then
            exit "$pytest_status"
          fi
          printf '%s\n' "$output" | grep -Eq '6 passed'
          if printf '%s\n' "$output" | grep -qi 'skipped'; then
            echo "D21B7 certification invalid: skipped tests detected"
            exit 1
          fi
      - name: Run canonical authentication workspace compatibility certificate
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output="$(.d21b7-venv/bin/python -m pytest -q -rs tests/unit/test_canonical_access_token_contract.py 2>&1)"
          pytest_status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$pytest_status" -ne 0 ]; then
            exit "$pytest_status"
          fi
          if printf '%s\n' "$output" | grep -qi 'skipped'; then
            echo "Canonical authentication compatibility invalid: skipped tests detected"
            exit 1
          fi
