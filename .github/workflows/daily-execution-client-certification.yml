# TITLE: WILSY OS Daily Execution Client GitHub Certification Workflow
# VERSION: v1.3.0-PEOPLE-OVERVIEW-RUNTIME-CERT
# AUTHORITY: WILSY OS Core Governance, test and build evidence only.
# EPITOME: Certify authenticated My Work, Daily Attention and Headquarters
#          client behavior on exact reviewed GitHub source and locked packages.
# ABSOLUTE CANONICAL PATH: /Users/wilsonkhanyezi/legal-doc-system/.github/workflows/daily-execution-client-certification.yml
# COLLABORATION / OWNERSHIP: Vitest client suite, My Work source integration,
#                           GitHub Actions and Vite frontend production build.
# CERTIFICATION / UPDATE DATE: 2026-11-17
# CHANGELOG: v1.3.0-PEOPLE-OVERVIEW-RUNTIME-CERT adds mounted People Overview runtime tests, contextual search and exact-tenant Python EOS summary into the protected client build gate.
# CHANGELOG: v1.2.0-PEOPLE-OWNED-APPLICATION-CI includes the active People component, styles, work-status tokens and fail-closed authority/prototype UI tests in exact-head interactive client certification.
# CHANGELOG: v1.1.1-503-COORDINATOR-REGRESSION-CERT adds the bounded
#            503 recovery and exact-session deduplication unit certificate to
#            this existing client gate; no production or privilege change.
#            v1.1.0-SINGLE-WORKER-BOUNDED-EXECUTION-CERT uses deterministic single-worker
#            bounded test execution already certified by the full local suite;
#            all existing test files and assertions remain unchanged.
# COMPLIANCE: POPIA section 19; GDPR Article 32; SOC 2 CC7.2.
# SECURITY / PRIVACY POSTURE: No deployment, credentials or tenant data read.
# TENANT BOUNDARY: Synthetic fixtures; EOS IAM remains authoritative.
# AUTHORITY BOUNDARY: Tests client projection; cannot grant source commands.
# FINANCIAL AUTHORITY BOUNDARY: Kennel EOS executes funds exclusively.
# FAIL-CLOSED POSTURE: Failed tests or build fail the workflow; no bypass.
name: WILSY Daily Execution Client Certification
# 2026-11-09: Include shared EOS source-coverage validator and My Work
# currentness test suites in exact-head CI without altering EOS authority.

on:
  pull_request:
    paths:
      - "client/src/App.jsx"
      - "client/src/components/chrome/WilsyDailyAttentionCentre.jsx"
      - "client/src/components/chrome/WilsyWorkDeadlineCalendar.jsx"
      - "client/src/components/workspaces/MyWorkWorkspace.jsx"
      - "client/src/components/workspaces/WilsyHeadquartersDailyBrief.jsx"
      - "client/src/components/workspaces/WilsyHeadquartersWorkspace.jsx"
      - "client/src/components/hr/HrDashboard.jsx"
      - "client/src/components/hr/HrDashboard.module.css"
      - "client/src/theme/workStatus.js"
      - "client/src/__tests__/components/hrDashboardAuthorityBoundary.test.js"
      - "client/src/__tests__/components/PeopleOverviewRuntime.test.jsx"
      - "client/src/services/unifiedMyWorkProjection.js"
      - "client/src/__tests__/components/WilsyDailyAttentionCentre.test.jsx"
      - "client/src/__tests__/components/WilsyWorkDeadlineCalendar.test.jsx"
      - "client/src/__tests__/components/MyWorkWorkspaceAttention.test.jsx"
      - "client/src/__tests__/components/MyWorkWorkspace.test.jsx"
      - "client/src/__tests__/services/unifiedMyWorkProjection.test.js"
      - "client/src/__tests__/services/unifiedMyWorkSync.test.js"
      - "client/src/services/unifiedMyWorkSync.js"
      - "client/src/__tests__/components/WilsyHeadquartersDailyBrief.test.jsx"
      - "client/src/__tests__/components/WilsyHeadquartersWorkspace.test.jsx"
      - "client/package-lock.json"
      - ".github/workflows/daily-execution-client-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-execution-client-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  daily-execution-client:
    name: Tenant-bound daily work, interactive triage and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout reviewed GitHub source
        uses: actions/checkout@v4
      - name: Prepare isolated test runner
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Restore locked client dependencies on CI only
        run: npm ci --include=dev --no-audit --no-fund --progress=false
      - name: Certify authorised daily work interactions
        run: >-
          npx vitest run --config vitest.config.js --maxWorkers=1 --testTimeout=15000
          src/__tests__/components/WilsyDailyAttentionCentre.test.jsx
          src/__tests__/components/WilsyWorkDeadlineCalendar.test.jsx
          src/__tests__/components/MyWorkWorkspaceAttention.test.jsx
          src/__tests__/components/MyWorkWorkspace.test.jsx
          src/__tests__/services/unifiedMyWorkProjection.test.js
          src/__tests__/services/unifiedMyWorkSync.test.js
          src/__tests__/components/WilsyHeadquartersDailyBrief.test.jsx
          src/__tests__/components/WilsyHeadquartersWorkspace.test.jsx
          src/__tests__/components/hrDashboardAuthorityBoundary.test.js
          src/__tests__/components/PeopleOverviewRuntime.test.jsx
      - name: Build production client bundle
        run: npm run build

# ARTIFACT: .github/workflows/daily-execution-client-certification.yml
# VERSION: v1.3.0-PEOPLE-OVERVIEW-RUNTIME-CERT
# AUTHORITY BOUNDARY: Client-only certificate; Python EOS owns business truth.
# TENANT POSTURE: No tenant admission or grants.
# FAIL-CLOSED POSTURE: All tests and build must complete successfully.
# FINANCIAL EXECUTION AUTHORITY: Kennel EOS exclusively.
# END OF WILSY OS SOVEREIGN ARTIFACT
