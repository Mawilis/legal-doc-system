name: Deputy device provenance certification

on:
  push:
    branches:
      - feat/deputy-location-evidence-mobile-suite-20261030
      - feat/deputy-location-evidence-completion-20261102
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deputy-device-provenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deputy-device-provenance:
    name: L8-6G/L8-6H authority, registry and transaction certification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DEPUTY_DEVICE_MONGO_URI: mongodb://localhost:27017/?replicaSet=wilsyDeputyCertRS
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node for pinned Pyright
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install repository and certification dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install -r requirements.txt pytest==9.1.1

      - name: Start isolated MongoDB replica set
        run: |
          docker run --detach --name wilsy-deputy-provenance-mongo \
            --publish 27017:27017 mongo:7.0.37 \
            mongod --replSet wilsyDeputyCertRS --bind_ip_all

      - name: Initialize MongoDB replica set
        run: |
          python - <<'PY'
          import time
          from pymongo import MongoClient

          client = MongoClient(
              "mongodb://localhost:27017",
              directConnection=True,
              serverSelectionTimeoutMS=2_000,
          )
          deadline = time.monotonic() + 60
          initiated = False
          last_error = None
          while True:
              try:
                  hello = client.admin.command("hello")
                  if not initiated and not hello.get("setName"):
                      client.admin.command({
                          "replSetInitiate": {
                              "_id": "wilsyDeputyCertRS",
                              "members": [{"_id": 0, "host": "localhost:27017"}],
                          }
                      })
                      initiated = True
                  if client.admin.command("hello").get("isWritablePrimary"):
                      break
              except Exception as error:
                  last_error = error
              if time.monotonic() >= deadline:
                  raise RuntimeError(
                      f"DEPUTY_PROVENANCE_MONGO_REPLICA_SET_UNAVAILABLE: {last_error!r}"
                  ) from last_error
              time.sleep(1)
          client.close()
          PY

      - name: Compile provenance contracts and certificates
        run: |
          python -m py_compile \
            tools/eos/legal_operations/domain/deputy_device_provenance_authority.py \
            tools/eos/legal_operations/registry/deputy_device_provenance_registry.py \
            tools/eos/legal_operations/orchestration/deputy_device_provenance_orchestrator.py \
            tests/unit/test_deputy_device_provenance_authority.py \
            tests/unit/test_deputy_device_provenance_registry.py \
            tests/unit/test_deputy_principal_binding_orchestrator.py \
            tests/integration/test_deputy_device_provenance_registry_mongo.py \
            tools/eos/auth/identity.py \
            tools/eos/auth/authentication.py \
            tools/eos/saas/auth/auth_registry.py \
            tools/eos/api/legal_operations_command_router.py \
            tests/unit/test_authentication_principal_authority.py \
            tests/unit/test_auth_registry_tenant_bearing_refresh.py \
            tests/integration/test_deputy_device_provenance_http.py

      - name: Type-check provenance contracts and certificates
        run: |
          npx --yes pyright@1.1.413 \
            --pythonpath "$(python -c 'import sys; print(sys.executable)')" \
            tools/eos/legal_operations/domain/deputy_device_provenance_authority.py \
            tools/eos/legal_operations/registry/deputy_device_provenance_registry.py \
            tools/eos/legal_operations/orchestration/deputy_device_provenance_orchestrator.py \
            tests/unit/test_deputy_device_provenance_authority.py \
            tests/unit/test_deputy_device_provenance_registry.py \
            tests/unit/test_deputy_principal_binding_orchestrator.py \
            tests/integration/test_deputy_device_provenance_registry_mongo.py \
            tools/eos/auth/identity.py \
            tools/eos/auth/authentication.py \
            tools/eos/saas/auth/auth_registry.py \
            tools/eos/api/legal_operations_command_router.py \
            tests/unit/test_authentication_principal_authority.py \
            tests/unit/test_auth_registry_tenant_bearing_refresh.py \
            tests/integration/test_deputy_device_provenance_http.py

      - name: Run authority, registry, binding and Mongo transaction certificates
        run: |
          python -m pytest -q \
            tests/unit/test_deputy_device_provenance_authority.py \
            tests/unit/test_deputy_device_provenance_registry.py \
            tests/unit/test_deputy_principal_binding_orchestrator.py \
            tests/integration/test_deputy_device_provenance_registry_mongo.py \
            tests/unit/test_authentication_principal_authority.py \
            tests/unit/test_auth_registry_tenant_bearing_refresh.py \
            tests/integration/test_deputy_device_provenance_http.py

      - name: Stop isolated MongoDB replica set
        if: always()
        run: docker rm -f wilsy-deputy-provenance-mongo 2>/dev/null || true
