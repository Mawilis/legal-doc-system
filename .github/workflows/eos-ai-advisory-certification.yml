# CERTIFICATION / UPDATE DATE: 2026-11-20
# CHANGELOG: v1.3.0-ZERO-RATED-COMMERCIAL-LIFECYCLE-CERT certifies
#   the real zero-rated plan amendment, subscription snapshot and P4 active
#   entitlement chain on a disposable Mongo replica; no Founder live writes.
