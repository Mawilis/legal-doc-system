name: WILSY EOS Atlas Control-Plane Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eos-atlas-control-plane-discovery
  cancel-in-progress: false

jobs:
  discover-atlas-control-plane:
    name: Read-only Atlas metadata discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ATLAS_PROJECT_ID: ${{ secrets.MONGODB_ATLAS_PROJECT_ID }}
      ATLAS_CLIENT_ID: ${{ secrets.MONGODB_ATLAS_CLIENT_ID }}
      ATLAS_CLIENT_SECRET: ${{ secrets.MONGODB_ATLAS_CLIENT_SECRET }}

    steps:
      - name: Validate secure Atlas authority inputs
        shell: bash
        run: |
          set -euo pipefail

          test -n "${ATLAS_PROJECT_ID:-}"
          test -n "${ATLAS_CLIENT_ID:-}"
          test -n "${ATLAS_CLIENT_SECRET:-}"

          printf '%s\\n' "::add-mask::${ATLAS_PROJECT_ID}"
          printf '%s\\n' "::add-mask::${ATLAS_CLIENT_ID}"
          printf '%s\\n' "::add-mask::${ATLAS_CLIENT_SECRET}"

          printf 'ATLAS_PROJECT_ID_PRESENT=YES\\n'
          printf 'ATLAS_CLIENT_ID_PRESENT=YES\\n'
          printf 'ATLAS_CLIENT_SECRET_PRESENT=YES\\n'
          printf 'ATLAS_SECRET_VALUE_PRINTED=NO\\n'

      - name: Discover Atlas project and cluster metadata with OAuth
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\\n' "::add-mask::${ATLAS_PROJECT_ID}"
          printf '%s\\n' "::add-mask::${ATLAS_CLIENT_ID}"
          printf '%s\\n' "::add-mask::${ATLAS_CLIENT_SECRET}"

          work_dir="$(mktemp -d)"
          token_file="${work_dir}/token.json"
          auth_file="${work_dir}/atlas-bearer-token"
          project_file="${work_dir}/project.json"
          cluster_file="${work_dir}/clusters.json"

          cleanup() {
            rm -rf "${work_dir}"
          }

          trap cleanup EXIT
          umask 077

          token_status="$(
            curl \
              --silent \
              --show-error \
              --user "${ATLAS_CLIENT_ID}:${ATLAS_CLIENT_SECRET}" \
              --header 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode 'grant_type=client_credentials' \
              --output "${token_file}" \
              --write-out '%{http_code}' \
              'https://cloud.mongodb.com/api/oauth/token'
          )"

          printf 'ATLAS_OAUTH_TOKEN_HTTP_STATUS=%s\\n' "${token_status}"

          if [ "${token_status}" != "200" ]; then
            printf 'ATLAS_OAUTH_TOKEN_ISSUED=NO\\n'
            printf 'ATLAS_OAUTH_RESPONSE_BODY_PRINTED=NO\\n'
            exit 22
          fi

          access_token="$(jq -er '.access_token | strings | select(length > 0)' "${token_file}")"
          printf '%s\\n' "::add-mask::${access_token}"
          printf '%s' "${access_token}" > "${auth_file}"
          chmod 600 "${auth_file}"
          unset access_token

          printf 'ATLAS_OAUTH_TOKEN_ISSUED=YES\\n'
          printf 'ATLAS_OAUTH_TOKEN_VALUE_PRINTED=NO\\n'

          atlas_accept='application/vnd.atlas.2023-01-01+json'

          atlas_get() {
            endpoint="$1"
            output_file="$2"
            label="$3"

            bearer_token="$(cat "${auth_file}")"
            status="$(
              curl \
                --silent \
                --show-error \
                --header "Authorization: Bearer ${bearer_token}" \
                --header "Accept: ${atlas_accept}" \
                --output "${output_file}" \
                --write-out '%{http_code}' \
                "${endpoint}"
            )"
            unset bearer_token

            printf '%s_HTTP_STATUS=%s\\n' "${label}" "${status}"

            if [ "${status}" != "200" ]; then
              jq -r --arg label "${label}" '
                [
                  [$label + "_ERROR_CODE", (.errorCode // "")],
                  [$label + "_ERROR_REASON", (.reason // "")],
                  [$label + "_ERROR_DETAIL", (.detail // "")]
                ][]
                | select(.[1] != "")
                | "\(.[0])=\(.[1])"
              ' "${output_file}"

              printf '%s_METADATA_READ=FAIL\\n' "${label}"
              return 22
            fi

            printf '%s_METADATA_READ=PASS\\n' "${label}"
          }

          atlas_get \
            "https://cloud.mongodb.com/api/atlas/v2/groups/${ATLAS_PROJECT_ID}" \
            "${project_file}" \
            "ATLAS_PROJECT"

          response_project_id="$(jq -r '.id // empty' "${project_file}")"

          test -n "${response_project_id}"
          test "${response_project_id}" = "${ATLAS_PROJECT_ID}"

          printf 'ATLAS_AUTHENTICATION_AND_PROJECT_ACCESS=PASS\\n'
          printf 'ATLAS_PROJECT_ID_MATCH=YES\\n'

          jq -r '"ATLAS_PROJECT_NAME=" + (.name // "")' "${project_file}"

          atlas_get \
            "https://cloud.mongodb.com/api/atlas/v2/groups/${ATLAS_PROJECT_ID}/clusters" \
            "${cluster_file}" \
            "ATLAS_CLUSTER"

          cluster_count="$(
            jq '
              if (.results | type) == "array"
              then (.results | length)
              else 0
              end
            ' "${cluster_file}"
          )"

          printf 'ATLAS_CLUSTER_COUNT=%s\\n' "${cluster_count}"

          jq -r '
            (.results // [])[]
            |
            [
              "ATLAS_CLUSTER",
              "NAME=" + (.name // ""),
              "STATE=" + (.stateName // ""),
              "TYPE=" + (.clusterType // ""),
              "PROVIDER=" + (.providerSettings.providerName // ""),
              "REGION=" + (.providerSettings.regionName // "")
            ]
            | join("|")
          ' "${cluster_file}"

          printf 'ATLAS_CONNECTION_STRING_PRINTED=NO\\n'
          printf 'ATLAS_SECRET_VALUE_PRINTED=NO\\n'
          printf 'ATLAS_RAW_RESPONSE_PRINTED=NO\\n'
          printf 'ATLAS_MUTATION_PERFORMED=NO\\n'

      - name: Assert read-only discovery boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          printf 'ATLAS_PROJECT_MUTATION_AUTHORIZED=NO\\n'
          printf 'ATLAS_CLUSTER_MUTATION_AUTHORIZED=NO\\n'
          printf 'ATLAS_DATABASE_USER_MUTATION_AUTHORIZED=NO\\n'
          printf 'ATLAS_NETWORK_MUTATION_AUTHORIZED=NO\\n'
          printf 'MONGODB_URI_GENERATION_AUTHORIZED=NO\\n'
          printf 'GITHUB_REPOSITORY_WRITE_AUTHORITY=NO\\n'
          printf 'ATLAS_DISCOVERY_BOUNDARY=PASS\\n'

