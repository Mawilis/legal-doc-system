#     - Establish manual, read-only Atlas metadata discovery.
#     - Consume existing Atlas API credentials only from GitHub Actions secrets.
#     - Never print Atlas credential values or the secret project-id value.
#     - Whitelist project/cluster metadata and discard raw provider responses.
#     - Perform no project, cluster, database-user, network, or runtime mutation.
# COMPLIANCE:
#   AGENTS.md v1.2.0-SOVEREIGN-LEGAL-OPERATIONS-CONSTITUTION.
# SECURITY / PRIVACY POSTURE:
#   contents:read only; no checkout or repository write capability is required.
#   Atlas credentials remain masked and are written only to an ephemeral
#   permission-0600 netrc file on the GitHub-hosted runner.
# TENANT BOUNDARY:
#   No tenant data is read or mutated.
# AUTHORITY BOUNDARY:
