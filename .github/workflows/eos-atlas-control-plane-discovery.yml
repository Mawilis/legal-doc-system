name: WILSY EOS Atlas Control-Plane Discovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eos-atlas-control-plane-discovery
  cancel-in-progress: false

jobs:
  discover-atlas-control-plane:
    name: Read-only Atlas metadata discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      ATLAS_PROJECT_ID: ${{ secrets.MONGODB_ATLAS_PROJECT_ID }}
      ATLAS_PUBLIC_KEY: ${{ secrets.MONGODB_ATLAS_PUBLIC_KEY }}
      ATLAS_PRIVATE_KEY: ${{ secrets.MONGODB_ATLAS_PRIVATE_KEY }}

    steps:
      - name: Validate secure Atlas authority inputs
        shell: bash
        run: |
          set -euo pipefail

          test -n "${ATLAS_PROJECT_ID:-}"
          test -n "${ATLAS_PUBLIC_KEY:-}"
          test -n "${ATLAS_PRIVATE_KEY:-}"

          printf '%s\n' "::add-mask::${ATLAS_PROJECT_ID}"
          printf '%s\n' "::add-mask::${ATLAS_PUBLIC_KEY}"
          printf '%s\n' "::add-mask::${ATLAS_PRIVATE_KEY}"

          printf 'ATLAS_PROJECT_ID_PRESENT=YES\n'
          printf 'ATLAS_PUBLIC_KEY_PRESENT=YES\n'
          printf 'ATLAS_PRIVATE_KEY_PRESENT=YES\n'
          printf 'ATLAS_SECRET_VALUE_PRINTED=NO\n'

      - name: Discover Atlas project and cluster metadata
        shell: bash
        run: |
          set -euo pipefail

          printf '%s\n' "::add-mask::${ATLAS_PROJECT_ID}"
          printf '%s\n' "::add-mask::${ATLAS_PUBLIC_KEY}"
          printf '%s\n' "::add-mask::${ATLAS_PRIVATE_KEY}"

          work_dir="$(mktemp -d)"
          auth_file="${work_dir}/atlas.netrc"
          project_file="${work_dir}/project.json"
          cluster_file="${work_dir}/clusters.json"

          cleanup() {
            rm -rf "${work_dir}"
          }

          trap cleanup EXIT
          umask 077

          {
            printf 'machine cloud.mongodb.com\n'
            printf 'login %s\n' "${ATLAS_PUBLIC_KEY}"
            printf 'password %s\n' "${ATLAS_PRIVATE_KEY}"
          } > "${auth_file}"

          chmod 600 "${auth_file}"

          atlas_accept='application/vnd.atlas.2023-01-01+json'

          atlas_get() {
            endpoint="$1"
            output_file="$2"
            label="$3"

            status="$(
              curl \
                --digest \
                --netrc-file "${auth_file}" \
                --silent \
                --show-error \
                --header "Accept: ${atlas_accept}" \
                --output "${output_file}" \
                --write-out '%{http_code}' \
                "${endpoint}"
            )"

            printf '%s_HTTP_STATUS=%s\n' "${label}" "${status}"

            if [ "${status}" != "200" ]; then
              jq -r --arg label "${label}" '
                [
                  [$label + "_ERROR_CODE", (.errorCode // "")],
                  [$label + "_ERROR_REASON", (.reason // "")],
                  [$label + "_ERROR_DETAIL", (.detail // "")]
                ]
                []
                | select(.[1] != "")
                | "\(.[0])=\(.[1])"
              ' "${output_file}"

              printf '%s_METADATA_READ=FAIL\n' "${label}"
              return 22
            fi

            printf '%s_METADATA_READ=PASS\n' "${label}"
          }

          atlas_get \
            "https://cloud.mongodb.com/api/atlas/v2/groups/${ATLAS_PROJECT_ID}" \
            "${project_file}" \
            "ATLAS_PROJECT"

          response_project_id="$(
            jq -r '.id // empty' "${project_file}"
          )"

          test -n "${response_project_id}"
          test "${response_project_id}" = "${ATLAS_PROJECT_ID}"

          printf 'ATLAS_AUTHENTICATION_AND_PROJECT_ACCESS=PASS\n'
          printf 'ATLAS_PROJECT_ID_MATCH=YES\n'

          jq -r '
            "ATLAS_PROJECT_NAME=" + (.name // "")
          ' "${project_file}"

          atlas_get \
            "https://cloud.mongodb.com/api/atlas/v2/groups/${ATLAS_PROJECT_ID}/clusters" \
            "${cluster_file}" \
            "ATLAS_CLUSTER"

          cluster_count="$(
            jq '
              if (.results | type) == "array"
              then (.results | length)
              else 0
              end
            ' "${cluster_file}"
          )"

          printf 'ATLAS_CLUSTER_COUNT=%s\n' "${cluster_count}"

          jq -r '
            (.results // [])[]
            |
            [
              "ATLAS_CLUSTER",
              "NAME=" + (.name // ""),
              "STATE=" + (.stateName // ""),
              "TYPE=" + (.clusterType // ""),
              "PROVIDER=" + (.providerSettings.providerName // ""),
              "REGION=" + (.providerSettings.regionName // "")
            ]
            | join("|")
          ' "${cluster_file}"

          printf 'ATLAS_CONNECTION_STRING_PRINTED=NO\n'
          printf 'ATLAS_SECRET_VALUE_PRINTED=NO\n'
          printf 'ATLAS_RAW_RESPONSE_PRINTED=NO\n'
          printf 'ATLAS_MUTATION_PERFORMED=NO\n'

      - name: Assert read-only discovery boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          printf 'ATLAS_PROJECT_MUTATION_AUTHORIZED=NO\n'
          printf 'ATLAS_CLUSTER_MUTATION_AUTHORIZED=NO\n'
          printf 'ATLAS_DATABASE_USER_MUTATION_AUTHORIZED=NO\n'
          printf 'ATLAS_NETWORK_MUTATION_AUTHORIZED=NO\n'
          printf 'MONGODB_URI_GENERATION_AUTHORIZED=NO\n'
          printf 'GITHUB_REPOSITORY_WRITE_AUTHORITY=NO\n'
          printf 'ATLAS_DISCOVERY_BOUNDARY=PASS\n'

