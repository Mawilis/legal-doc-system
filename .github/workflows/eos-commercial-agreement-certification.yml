name: EOS Commercial Agreement Domain Certification

on:
  push:
    branches:
      - eos/commercial-agreement-bundle-activation
    paths:
      - "tools/eos/saas/entitlement/commercial_agreement.py"
      - "tools/eos/saas/entitlement/commercial_offer_catalogue.py"
      - "tests/unit/test_commercial_agreement.py"
      - ".github/workflows/eos-commercial-agreement-certification.yml"
  pull_request:
    paths:
      - "tools/eos/saas/entitlement/commercial_agreement.py"
      - "tools/eos/saas/entitlement/commercial_offer_catalogue.py"
      - "tests/unit/test_commercial_agreement.py"
      - ".github/workflows/eos-commercial-agreement-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eos-commercial-agreement-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commercial-agreement-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository dependencies and pytest
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest==9.1.1
      - name: Compile commercial agreement authority
        run: |
          python -m compileall -q tools/eos/saas/entitlement/commercial_agreement.py tools/eos/saas/entitlement/commercial_offer_catalogue.py
      - name: Run commercial agreement domain tests
        run: |
          python -m pytest -q tests/unit/test_commercial_agreement.py tests/unit/test_commercial_offer_catalogue.py
      - name: Enforce repository integrity
        run: |
          python tools/eos/governance/repository_integrity_guard.py --commit "$GITHUB_SHA"
