name: EOS Commercial Offer Catalogue Certification

on:
  push:
    branches:
      - eos/tenant-discovery-iam-dashboard-roadmap
    paths:
      - "tools/eos/saas/entitlement/commercial_offer_catalogue.py"
      - "tools/eos/saas/entitlement/product_catalogue.py"
      - "tests/unit/test_commercial_offer_catalogue.py"
      - ".github/workflows/eos-commercial-offer-catalogue-certification.yml"
  pull_request:
    paths:
      - "tools/eos/saas/entitlement/commercial_offer_catalogue.py"
      - "tools/eos/saas/entitlement/product_catalogue.py"
      - "tests/unit/test_commercial_offer_catalogue.py"
      - ".github/workflows/eos-commercial-offer-catalogue-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eos-commercial-offer-catalogue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commercial-offer-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install repository dependencies and exact pytest
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Compile commercial offer and product catalogues
        run: |
          python -m compileall -q tools/eos/saas/entitlement/commercial_offer_catalogue.py tools/eos/saas/entitlement/product_catalogue.py

      - name: Run direct commercial offer and product catalogue certificates
        run: |
          python -m pytest -q tests/unit/test_commercial_offer_catalogue.py tests/unit/test_tenant_product_catalogue.py

      - name: Enforce repository integrity
        run: |
          python tools/eos/governance/repository_integrity_guard.py --commit "$GITHUB_SHA"
