name: EOS ECS Fargate Production Foundation Certification

on:
  pull_request:
    paths:
      - "infra/aws/eos-production-ecs-foundation.yaml"
      - "tests/unit/test_eos_production_ecs_foundation.py"
      - "docs/operations/eos-production-ecs-fargate-foundation.md"
      - ".github/workflows/eos-ecs-production-foundation-certification.yml"
  push:
    branches:
      - eos/kennel-eos-production-runtime-20261108
    paths:
      - "infra/aws/eos-production-ecs-foundation.yaml"
      - "tests/unit/test_eos_production_ecs_foundation.py"
      - "docs/operations/eos-production-ecs-fargate-foundation.md"
      - ".github/workflows/eos-ecs-production-foundation-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-foundation-certification:
    name: Lint and test inactive ECS foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned test and infrastructure validators
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 cfn-lint==1.60.0
      - name: Lint ECS Fargate CloudFormation
        run: |
          cfn-lint --version
          cfn-lint --template infra/aws/eos-production-ecs-foundation.yaml
      - name: Run ECS production foundation safety contract
        run: python -m pytest -q tests/unit/test_eos_production_ecs_foundation.py
      - name: Verify patch whitespace
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD" -- \
              infra/aws/eos-production-ecs-foundation.yaml \
              tests/unit/test_eos_production_ecs-foundation.py \
              docs/operations/eos-production-ecs-fargate-foundation.md \
              .github/workflows/eos-ecs-production-foundation-certification.yml
          else
            git diff --check "${GITHUB_EVENT_BEFORE}...HEAD" -- \
              infra/aws/eos-production-ecs-foundation.yaml \
              tests/unit/test_eos_production_ecs_foundation.py \
              docs/operations/eos-production-ecs-fargate-foundation.md \
              .github/workflows/eos-ecs-production-foundation-certification.yml
          fi
