name: EOS ECS Fargate Production Foundation Certification

on:
  pull_request:
    paths:
      - "infra/aws/eos-production-ecs-foundation.yaml"
      - "infra/aws/README-global-principal-mfa-kms.md"
      - "infra/docker/Dockerfile.eos"
      - "scripts/discover-eos-production-runtime.sh"
      - "tools/eos/auth/ecs_production_workload_identity_probe.py"
      - "tests/unit/test_ecs_production_workload_identity_probe.py"
      - "tests/unit/test_eos_production_ecs_foundation.py"
      - "docs/operations/eos-production-ecs-fargate-foundation.md"
      - "docs/operations/eos-production-provisioning-prerequisite-register.md"
      - ".github/workflows/eos-image-publication.yml"
      - ".github/workflows/eos-ecs-production-foundation-certification.yml"
  push:
    branches:
      - eos/kennel-eos-production-runtime-20261108
    paths:
      - "infra/aws/eos-production-ecs-foundation.yaml"
      - "infra/aws/README-global-principal-mfa-kms.md"
      - "infra/docker/Dockerfile.eos"
      - "tools/eos/auth/ecs_production_workload_identity_probe.py"
      - "tests/unit/test_ecs_production_workload_identity_probe.py"
      - "tests/unit/test_eos_production_ecs_foundation.py"
      - "docs/operations/eos-production-ecs-fargate-foundation.md"
      - "docs/operations/eos-production-provisioning-prerequisite-register.md"
      - ".github/workflows/eos-image-publication.yml"
      - ".github/workflows/eos-ecs-production-foundation-certification.yml"
  workflow_dispatch:
permissions:
  contents: read

jobs:
  static-foundation-certification:
    name: Lint and test inactive ECS foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned test and infrastructure validators
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 cfn-lint==1.60.0
      - name: Lint ECS Fargate CloudFormation
        run: |
          cfn-lint --version
          cfn-lint --template infra/aws/eos-production-ecs-foundation.yaml
      - name: Run ECS production foundation and workload identity contracts
        run: python -m pytest -q tests/unit/test_eos_production_ecs_foundation.py tests/unit/test_ecs_production_workload_identity_probe.py
      - name: Validate read-only production discovery script syntax
        run: bash -n scripts/discover-eos-production-runtime.sh
      - name: Build the canonical Python EOS production image
        run: docker build --file infra/docker/Dockerfile.eos --tag wilsy-eos-production:certification .
      - name: Verify patch whitespace
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD" -- \
              infra/aws/eos-production-ecs-foundation.yaml \
              infra/aws/README-global-principal-mfa-kms.md \
              infra/docker/Dockerfile.eos \
              scripts/discover-eos-production-runtime.sh \
              tools/eos/auth/ecs_production_workload_identity_probe.py \
              tests/unit/test_ecs_production_workload_identity_probe.py \
              tests/unit/test_eos_production_ecs_foundation.py \
              docs/operations/eos-production-ecs-fargate-foundation.md \
              docs/operations/eos-production-provisioning-prerequisite-register.md \
              .github/workflows/eos-image-publication.yml \
              .github/workflows/eos-ecs-production-foundation-certification.yml
          else
            git diff --check "${GITHUB_EVENT_BEFORE}...HEAD" -- \
              infra/aws/eos-production-ecs-foundation.yaml \
              infra/aws/README-global-principal-mfa-kms.md \
              infra/docker/Dockerfile.eos \
              tools/eos/auth/ecs_production_workload_identity_probe.py \
              tests/unit/test_ecs_production_workload_identity_probe.py \
              tests/unit/test_eos_production_ecs_foundation.py \
              docs/operations/eos-production-ecs-fargate-foundation.md \
              docs/operations/eos-production-provisioning-prerequisite-register.md \
              .github/workflows/eos-image-publication.yml \
              .github/workflows/eos-ecs-production-foundation-certification.yml
          fi

