# CHANGELOG:
#   v1.0.1-EOS-ECS-PRODUCTION-FOUNDATION-CERTIFICATION adds the mandatory
#   sovereign artifact contract and corrects the test path in the whitespace
#   gate to the actual underscore-delimited filename. No provisioning or
#   deployment capability is introduced.
#   v1.0.0 established isolated lint, static test and whitespace checks.
# COMPLIANCE: AGENTS.md v1.2.0-SOVEREIGN-LEGAL-OPERATIONS-CONSTITUTION.
