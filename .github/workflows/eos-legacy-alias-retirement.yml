name: EOS Legacy Alias Retirement Certificate

on:
  push:
    paths:
      - "tools/eos/tenancy/retire_legacy_root_aliases.py"
      - "tests/unit/test_retire_legacy_root_aliases.py"
      - ".github/workflows/eos-legacy-alias-retirement.yml"
  pull_request:
    paths:
      - "tools/eos/tenancy/retire_legacy_root_aliases.py"
      - "tests/unit/test_retire_legacy_root_aliases.py"
      - ".github/workflows/eos-legacy-alias-retirement.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retirement-certificate:
    name: Dry-run and immutable-evidence safety certificate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install certificate dependencies
        run: python -m pip install --disable-pip-version-check pymongo pytest

      - name: Compile EOS retirement implementation
        run: python -m py_compile tools/eos/tenancy/retire_legacy_root_aliases.py tests/unit/test_retire_legacy_root_aliases.py

      - name: Run EOS retirement safety certificate
        run: python -m pytest -q tests/unit/test_retire_legacy_root_aliases.py
