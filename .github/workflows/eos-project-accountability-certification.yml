name: EOS Governed Tenant Project Accountability Certification

on:
  push:
    branches:
      - eos/p1-my-work-session-sync-20261109
  pull_request:
    paths:
      - tools/eos/api/projects_router.py
      - tools/eos/saas/domain/project.py
      - tools/eos/saas/domain/project_note.py
      - tools/eos/saas/projects/project_note_registry.py
      - tools/eos/auth/roles.py
      - tools/eos/auth/permission_namespace.py
      - tools/eos/auth/tenant_authority_policy.py
      - tools/eos/auth/tenant_authorization.py
      - tests/unit/test_roles.py
      - tests/unit/test_permission_namespace.py
      - tests/unit/test_tenant_authorization.py
      - tests/unit/test_tenant_authority_policy.py
      - tools/eos/saas/projects/project_participant_registry.py
      - tools/eos/saas/projects/project_task_registry.py
      - tools/eos/api/server.py
      - tools/eos/saas/projects/project_registry.py
      - tests/unit/test_projects_router_contract.py
      - tests/unit/test_project_domain.py
      - tests/unit/test_project_note_domain.py
      - tests/unit/test_project_participant_registry.py
      - tests/unit/test_project_task_registry.py
      - tests/integration/test_project_tasks_real_mongo.py
      - tests/integration/test_project_participant_real_mongo.py
      - tests/unit/test_project_registry.py
      - tests/integration/test_project_accountability_real_mongo.py
      - tests/e2e/projects-layout.browser.spec.js
      - client/src/components/workspaces/ProjectsWorkspace.jsx
      - client/src/components/workspaces/ProjectNotesPanel.jsx
      - client/src/components/workspaces/ProjectTasksPanel.jsx
      - client/src/components/workspaces/ProjectParticipantsPanel.jsx
      - client/src/__tests__/components/ProjectsWorkspace.test.jsx
      - .github/workflows/eos-project-accountability-certification.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eos-project-accountability-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  governed-project-accountability:
    name: Exact tenant assignment, source authority and client certification
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install governed Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest==9.1.1 httpx
      - name: Compile exact Projects sources and certificates
        run: |
          python -m py_compile tools/eos/api/projects_router.py tools/eos/saas/domain/project.py tools/eos/saas/projects/project_registry.py tests/unit/test_projects_router_contract.py tools/eos/saas/domain/project_note.py tools/eos/saas/projects/project_note_registry.py tests/unit/test_project_note_domain.py tools/eos/saas/projects/project_participant_registry.py tests/unit/test_project_participant_registry.py tools/eos/saas/projects/project_task_registry.py tests/unit/test_project_task_registry.py
      - name: Certify project IAM, schema, registry, replay and assignment
        run: |
          python -m pytest -q tests/unit/test_projects_router_contract.py tests/unit/test_project_domain.py tests/unit/test_project_registry.py tests/unit/test_project_note_domain.py tests/unit/test_project_participant_registry.py tests/unit/test_roles.py tests/unit/test_permission_namespace.py tests/unit/test_tenant_authorization.py tests/unit/test_tenant_authority_policy.py tests/unit/test_project_task_registry.py
      - name: Start disposable MongoDB replica set
        run: |
          docker run -d --name wilsy-projects-accountability-mongo -p 27017:27017 mongo:7.0.37 mongod --replSet wilsyProjectAccountabilityCertRS --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec wilsy-projects-accountability-mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1; then break; fi
            sleep 2
          done
          docker exec wilsy-projects-accountability-mongo mongosh --quiet --eval 'rs.initiate({_id:"wilsyProjectAccountabilityCertRS",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec wilsy-projects-accountability-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Certify real Mongo project owner and department transactions
        env:
          TEST_PROJECTS_ACCOUNTABILITY_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=wilsyProjectAccountabilityCertRS
        run: python -m pytest -q tests/integration/test_project_accountability_real_mongo.py tests/integration/test_project_participant_real_mongo.py tests/integration/test_project_tasks_real_mongo.py
      - name: Stop disposable MongoDB
        if: always()
        run: docker rm -f wilsy-projects-accountability-mongo 2>/dev/null || true
      - name: Prepare isolated client
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Restore locked client dependencies
        working-directory: client
        run: npm ci --include=dev --no-audit --no-fund --progress=false
      - name: Certify project source-backed interaction
        working-directory: client
        run: npx vitest run --config vitest.config.js --maxWorkers=1 --testTimeout=15000 src/__tests__/components/ProjectsWorkspace.test.jsx
      - name: Build certified frontend
        working-directory: client
        run: npm run build

      - name: Install existing browser certification tooling
        run: npm ci --legacy-peer-deps --ignore-scripts --no-audit --no-fund --progress=false
      - name: Install isolated Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Certify rendered desktop and mobile Projects layout
        env:
          BROWSER_CERT_BASE_URL: http://127.0.0.1:5173
          CI: "true"
        run: |
          npm --prefix client run dev -- --host 127.0.0.1 --port 5173 --strictPort >/tmp/wilsy-projects-visual-vite.log 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:5173/discovery; then break; fi
            sleep 2
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:5173/discovery
          npx playwright test --config tests/e2e/playwright.config.js tests/e2e/projects-layout.browser.spec.js


