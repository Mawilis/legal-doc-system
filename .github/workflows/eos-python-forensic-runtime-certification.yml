name: Python EOS Forensic Runtime Certification

on:
  pull_request:
    paths:
      - "tools/eos/api/forensic_merkle_router.py"
      - "tools/eos/api/artifact_pdf_router.py"
      - "tools/eos/security/forensic_merkle_registry.py"
      - "tools/eos/api/server.py"
      - "server/server.js"
      - "server/app.js"
      - "requirements.txt"
      - "tests/unit/test_artifact_pdf_router.py"
      - "server/app.js"
      - "server/routes/api.js"
      - "server/routes/forensicRoutes.js"
      - "client/src/services/wilsyForensicMerkleClient.js"
      - "client/src/components/chrome/WilsyForensicMerkleShowroom.jsx"
      - "client/vite.config.js"
      - "tests/unit/test_forensic_merkle_registry.py"
      - "tests/unit/test_forensic_merkle_router.py"
      - "tests/unit/test_python_eos_forensic_runtime_retirement.py"
      - "tests/unit/test_artifact_pdf_router.py"
      - ".github/workflows/eos-python-forensic-runtime-certification.yml"
  push:
    branches:
      - eos/python-only-runtime-retirement-20261108
    paths:
      - "tools/eos/api/forensic_merkle_router.py"
      - "tools/eos/security/forensic_merkle_registry.py"
      - "tools/eos/api/server.py"
      - "tools/eos/api/artifact_pdf_router.py"
      - "server/server.js"
      - "requirements.txt"
      - "tests/unit/test_python_eos_forensic_runtime_retirement.py"
      - "tests/unit/test_artifact_pdf_router.py"
      - "server/app.js"
      - "server/routes/api.js"
      - "server/routes/forensicRoutes.js"
      - "client/src/services/wilsyForensicMerkleClient.js"
      - "client/src/components/chrome/WilsyForensicMerkleShowroom.jsx"
      - "client/vite.config.js"
      - "tests/unit/test_forensic_merkle_registry.py"
      - "tests/unit/test_forensic_merkle_router.py"
      - "tests/unit/test_python_eos_forensic_runtime_retirement.py"
      - ".github/workflows/eos-python-forensic-runtime-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-eos-forensic-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forensic-python-eos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python EOS dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest==9.1.1 httpx
      - name: Compile Python EOS forensic runtime
        run: |
          python -m py_compile tools/eos/security/forensic_merkle_registry.py tools/eos/api/forensic_merkle_router.py tools/eos/api/artifact_pdf_router.py tools/eos/api/server.py
      - name: Run forensic registry and authenticated route tests
        run: |
          python -m pytest -q tests/unit/test_forensic_merkle_registry.py tests/unit/test_forensic_merkle_router.py tests/unit/test_python_eos_forensic_runtime_retirement.py tests/unit/test_artifact_pdf_router.py
