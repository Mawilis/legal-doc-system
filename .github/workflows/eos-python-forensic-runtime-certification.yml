name: Python EOS Forensic Runtime Certification

on:
  pull_request:
    paths:
      - "tools/eos/api/forensic_merkle_router.py"
      - "tools/eos/api/artifact_pdf_router.py"
      - "tools/eos/api/billing_router.py"
      - "tools/eos/api/server.py"
      - "tools/eos/security/forensic_merkle_registry.py"
      - "tools/eos/saas/billing/invoice_qr_legacy_contract.py"
      - "tools/eos/governance/production_surface_policy.json"
      - "tools/eos/governance/repository_integrity_guard.py"
      - "server/**"
      - "services/**"
      - "requirements.txt"
      - "client/src/components/billing/ForensicProofBlock.jsx"
      - "client/src/services/wilsyForensicMerkleClient.js"
      - "client/src/components/chrome/WilsyForensicMerkleShowroom.jsx"
      - "client/vite.config.js"
      - "tests/unit/test_forensic_merkle_registry.py"
      - "tests/unit/test_forensic_merkle_router.py"
      - "tests/unit/test_artifact_pdf_router.py"
      - "tests/unit/test_python_eos_forensic_runtime_retirement.py"
      - "tests/unit/test_billing_invoice_proof_tenant_boundary.py"
      - "tests/unit/test_billing_qr_tenant_boundary.py"
      - "tests/unit/test_invoice_qr_legacy_contract.py"
      - "tests/unit/test_global_principal_auth_challenge_startup.py"
      - "tests/unit/test_system_services_case_startup.py"
      - ".github/workflows/eos-python-forensic-runtime-certification.yml"
  push:
    branches:
      - eos/python-only-runtime-retirement-20261108
      - eos/daily-attention-consolidation-20261110
    paths:
      - "tools/eos/api/forensic_merkle_router.py"
      - "tools/eos/api/artifact_pdf_router.py"
      - "tools/eos/api/billing_router.py"
      - "tools/eos/api/server.py"
      - "tools/eos/security/forensic_merkle_registry.py"
      - "tools/eos/saas/billing/invoice_qr_legacy_contract.py"
      - "tools/eos/governance/production_surface_policy.json"
      - "tests/unit/test_python_eos_forensic_runtime_retirement.py"
      - "tests/unit/test_billing_invoice_proof_tenant_boundary.py"
      - "tests/unit/test_billing_qr_tenant_boundary.py"
      - "tests/unit/test_invoice_qr_legacy_contract.py"
      - ".github/workflows/eos-python-forensic-runtime-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-eos-forensic-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  forensic-python-eos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python EOS dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest==9.1.1 httpx
      - name: Compile Python EOS forensic and QR runtime
        run: |
          python -m py_compile \
            tools/eos/security/forensic_merkle_registry.py \
            tools/eos/api/forensic_merkle_router.py \
            tools/eos/api/artifact_pdf_router.py \
            tools/eos/api/billing_router.py \
            tools/eos/saas/billing/invoice_qr_legacy_contract.py \
            tools/eos/api/server.py
      - name: Run forensic, QR, and authenticated route certificates
        run: |
          python -m pytest -q \
            tests/unit/test_forensic_merkle_registry.py \
            tests/unit/test_forensic_merkle_router.py \
            tests/unit/test_artifact_pdf_router.py \
            tests/unit/test_python_eos_forensic_runtime_retirement.py \
            tests/unit/test_billing_invoice_proof_tenant_boundary.py \
            tests/unit/test_billing_qr_tenant_boundary.py \
            tests/unit/test_invoice_qr_legacy_contract.py \
            tests/unit/test_global_principal_auth_challenge_startup.py \
            tests/unit/test_system_services_case_startup.py

