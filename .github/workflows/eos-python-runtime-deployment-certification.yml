name: Python EOS Runtime Deployment Certification

on:
  push:
    branches:
      - eos/python-only-runtime-retirement-20261108
    paths:
      - "Dockerfile.eos"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.eos.yml"
      - "requirements.txt"
      - "tools/eos/**"
      - "tests/unit/test_durable_task_queue.py"
      - "tests/unit/test_durable_worker_runner.py"
      - "tests/unit/test_durable_worker_runtime.py"
      - "tests/unit/test_compliance_scan_worker.py"
      - "tests/unit/test_compliance_scan_scheduler.py"
      - "tests/integration/test_durable_task_queue_real_mongo.py"
      - "tests/unit/test_python_eos_runtime_deployment.py"
      - ".github/workflows/eos-python-runtime-deployment-certification.yml"
  pull_request:
    paths:
      - "Dockerfile.eos"
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.eos.yml"
      - "requirements.txt"
      - "tools/eos/**"
      - "tests/unit/test_durable_task_queue.py"
      - "tests/unit/test_durable_worker_runner.py"
      - "tests/integration/test_durable_task_queue_real_mongo.py"
      - "tests/unit/test_python_eos_runtime_deployment.py"
      - ".github/workflows/eos-python-runtime-deployment-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-eos-runtime-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-eos-image:
    name: Build and certify Python EOS image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python EOS test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest==9.1.1 httpx
      - name: Run Python runtime deployment tests
        run: python -m pytest -q tests/unit/test_python_eos_runtime_deployment.py
      - name: Validate canonical Python EOS Compose manifests
        run: |
          MONGODB_URI="mongodb://127.0.0.1:27017" docker compose --file docker-compose.yml config --quiet
          MONGODB_URI="mongodb://127.0.0.1:27017" docker compose --file docker-compose.eos.yml config --quiet
      - name: Test durable EOS task queue contracts
        run: python -m pytest -q tests/unit/test_durable_task_queue.py tests/unit/test_durable_worker_runner.py tests/unit/test_durable_worker_runtime.py tests/unit/test_compliance_scan_worker.py tests/unit/test_compliance_scan_scheduler.py tests/integration/test_durable_task_queue_real_mongo.py
      - name: Certify durable worker transactions on a real replica set
        run: |
          docker run --detach --rm --name eos-worker-mongo -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec eos-worker-mongo mongosh --quiet --eval "db.adminCommand({ ping: 1 }).ok" | grep -q 1; then break; fi
            sleep 2
          done
          docker exec eos-worker-mongo mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})" || true
          for attempt in $(seq 1 45); do
            if docker exec eos-worker-mongo mongosh --quiet --eval "db.hello().isWritablePrimary" | grep -q true; then break; fi
            sleep 2
          done
          TEST_EOS_WORKER_MONGO_URI="mongodb://127.0.0.1:27017/?replicaSet=rs0" python -m pytest -q tests/integration/test_durable_task_queue_real_mongo.py
      - name: Compile canonical Python EOS application
        run: python -m py_compile tools/eos/api/server.py tools/eos/runtime/durable_task_queue.py tools/eos/runtime/durable_worker_runner.py tools/eos/runtime/durable_worker_runtime.py tools/eos/runtime/compliance_scan_worker.py tools/eos/runtime/compliance_scan_scheduler.py tools/eos/runtime/worker_process.py
      - name: Build Python-only runtime image
        run: docker build --file Dockerfile.eos --tag wilsy-eos-python:certification .
