name: EOS Runtime Database Consumer Inventory Certification

on:
  pull_request:
    paths:
      - "tools/eos/**"
      - "server/**"
      - "services/**"
      - "scripts/start-dev-stack.sh"
      - "start_all.sh"
      - "start_wilsy_os.sh"
      - "GlobalLaunchSequence.sh"
      - "Genesis_Ignition.sh"
      - "Sovereign_Deployment_Automation.sh"
      - "repair_launcher.js"
      - "build_orchestrator.js"
      - "update_orchestrator.js"
      - "bootstrap_wilsy_os.js"
      - "nginx.conf"
      - "infra/nginx/**"
      - "k8s/**"
      - "charts/legal-os/**"
      - "DEPLOYMENT.md"
      - "server/README.md"
      - "package-lock.json"
      - "package.json"
      - "runbook_diagnostic.py"
      - "tests/unit/test_eos_runtime_database_consumer_inventory.py"
      - "tests/unit/test_sovereign_artifact_contract.py"
      - "docs/architecture/eos-runtime-database-consumer-inventory.md"
      - ".github/workflows/eos-runtime-database-consumer-inventory.yml"

permissions:
  contents: read

jobs:
  runtime-database-ownership:
    name: Runtime database ownership and retired backend entrypoints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile governed Python artifacts
        run: |
          python -m py_compile \
            runbook_diagnostic.py \
            tests/unit/test_eos_runtime_database_consumer_inventory.py \
            tests/unit/test_sovereign_artifact_contract.py

      - name: Certify Python EOS runtime database ownership and sovereign artifacts
        run: |
          python -m pytest -q \
            tests/unit/test_eos_runtime_database_consumer_inventory.py \
            tests/unit/test_sovereign_artifact_contract.py

