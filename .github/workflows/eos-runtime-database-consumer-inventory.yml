name: EOS Runtime Database Consumer Inventory Certification

on:
  pull_request:
    paths:
      - "tools/eos/**"
      - "server/**"
      - "scripts/start-dev-stack.sh"
      - "package.json"
      - "tests/unit/test_eos_runtime_database_consumer_inventory.py"
      - "docs/architecture/eos-runtime-database-consumer-inventory.md"
      - ".github/workflows/eos-runtime-database-consumer-inventory.yml"

permissions:
  contents: read

jobs:
  runtime-database-ownership:
    name: Runtime database ownership and retired backend entrypoints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Certify Python EOS runtime database ownership and Node backend retirement
        run: python -m pytest -q tests/unit/test_eos_runtime_database_consumer_inventory.py
