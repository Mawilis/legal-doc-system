name: EOS Telemetry Dual Trace Index Certification

on:
  pull_request:
    paths:
      - "tools/eos/api/telemetry_ingestion_router.py"
      - "tests/unit/test_telemetry_ingestion_router.py"
      - ".github/workflows/eos-telemetry-trace-compatibility-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry-trace:
    name: Verify server trace identity and indexed telemetry writes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore locked EOS test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest==9.1.1 httpx
      - name: Compile canonical EOS telemetry module and contract tests
        run: |
          python -m py_compile tools/eos/api/telemetry_ingestion_router.py tests/unit/test_telemetry_ingestion_router.py
      - name: Run exact tenant and dual-index telemetry contracts
        run: |
          python -m pytest -q tests/unit/test_telemetry_ingestion_router.py
