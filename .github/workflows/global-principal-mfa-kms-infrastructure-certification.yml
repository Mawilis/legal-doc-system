name: EOS Global Principal MFA KMS Infrastructure Certification
on:
  pull_request:
    paths:
      - "infra/aws/global-principal-mfa-kms.yaml"
      - "infra/aws/README-global-principal-mfa-kms.md"
      - ".github/workflows/global-principal-mfa-kms-infrastructure-certification.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  global-principal-mfa-kms-template:
    name: Validate dedicated MFA KMS and EKS workload identity template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CloudFormation linter
        run: |
          python -m pip install --disable-pip-version-check cfn-lint==1.60.0
      - name: Lint Global Principal MFA KMS CloudFormation template
        run: |
          cfn-lint --version
          cfn-lint --template infra/aws/global-principal-mfa-kms.yaml
      - name: Verify template diff whitespace
        run: |
          git diff --check "origin/${{ github.base_ref }}...HEAD" -- \
            infra/aws/global-principal-mfa-kms.yaml \
            infra/aws/README-global-principal-mfa-kms.md \
            .github/workflows/global-principal-mfa-kms-infrastructure-certification.yml
