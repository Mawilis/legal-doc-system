name: WILSY Headquarters Candidate Evidence Binary Storage

on:
  pull_request:
    paths:
      - "tools/eos/saas/hr/candidate_evidence_storage.py"
      - "tools/eos/saas/hr/candidate_evidence_s3_storage_adapter.py"
      - "tests/unit/test_candidate_evidence_s3_storage_adapter.py"
      - ".github/workflows/headquarters-candidate-evidence-binary-storage.yml"

permissions:
  contents: read

jobs:
  candidate-evidence-binary-storage:
    name: Candidate evidence binary storage contract and S3 adapter tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.1.1
      - name: Compile candidate evidence storage modules
        run: |
          python -m py_compile \
            tools/eos/saas/hr/candidate_evidence_storage.py \
            tools/eos/saas/hr/candidate_evidence_s3_storage_adapter.py \
            tests/unit/test_candidate_evidence_s3_storage_adapter.py
      - name: Run candidate evidence S3 adapter tests
        run: python -m pytest -q tests/unit/test_candidate_evidence_s3_storage_adapter.py
