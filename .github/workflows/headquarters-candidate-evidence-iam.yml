name: WILSY Headquarters Candidate Evidence IAM
on:
  pull_request:
    paths:
      - "tools/eos/auth/tenant_authority_policy.py"
      - "tools/eos/auth/permission_namespace.py"
      - "tests/unit/test_candidate_evidence_iam_policy.py"
      - ".github/workflows/headquarters-candidate-evidence-iam.yml"
permissions:
  contents: read
jobs:
  candidate-evidence-iam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.1.1
      - name: Compile canonical IAM modules
        run: python -m py_compile tools/eos/auth/tenant_authority_policy.py tools/eos/auth/permission_namespace.py tests/unit/test_candidate_evidence_iam_policy.py
      - name: Test candidate evidence IAM boundary
        run: python -m pytest -q tests/unit/test_candidate_evidence_iam_policy.py
