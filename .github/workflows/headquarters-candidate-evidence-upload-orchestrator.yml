name: WILSY Candidate Evidence Upload Orchestration

on:
  pull_request:
    paths:
      - "tools/eos/saas/hr/candidate_evidence_upload_orchestrator.py"
      - "tools/eos/saas/hr/candidate_evidence_upload_attempt_registry.py"
      - "tools/eos/saas/hr/candidate_evidence_storage.py"
      - "tools/eos/saas/hr/candidate_evidence_s3_storage_adapter.py"
      - "tests/unit/test_candidate_evidence_upload_orchestrator.py"
      - ".github/workflows/headquarters-candidate-evidence-upload-orchestrator.yml"

permissions:
  contents: read

jobs:
  candidate-evidence-upload-orchestration:
    name: Durable streamed upload orchestration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.1.1
      - name: Compile orchestration and tests
        run: |
          python -m py_compile \
            tools/eos/saas/hr/candidate_evidence_upload_orchestrator.py \
            tools/eos/saas/hr/candidate_evidence_upload_attempt_registry.py \
            tests/unit/test_candidate_evidence_upload_orchestrator.py
      - name: Run orchestration tests
        run: python -m pytest -q tests/unit/test_candidate_evidence_upload_orchestrator.py tests/unit/test_candidate_evidence_upload_attempt_registry.py
