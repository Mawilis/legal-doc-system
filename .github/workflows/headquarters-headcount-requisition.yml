name: WILSY Headquarters Headcount Requisition Domain

on:
  pull_request:
    paths:
      - "tools/eos/saas/domain/headcount_requisition.py"
      - "tests/unit/test_headcount_requisition_domain.py"
      - ".github/workflows/headquarters-headcount-requisition.yml"

permissions:
  contents: read

jobs:
  headcount-requisition:
    name: Headcount state machine and maker-checker tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install governed Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.1.1
      - name: Compile requisition domain
        run: python -m py_compile tools/eos/saas/domain/headcount_requisition.py tests/unit/test_headcount_requisition_domain.py
      - name: Run headcount requisition policy tests
        run: python -m pytest -q tests/unit/test_headcount_requisition_domain.py
