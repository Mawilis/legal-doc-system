name: WILSY Headquarters Headcount Requisition Domain and Commands

on:
  pull_request:
    paths:
      - "tools/eos/saas/domain/headcount_requisition.py"
      - "tools/eos/saas/hr/headcount_requisition_registry.py"
      - "tools/eos/api/headcount_requisition_router.py"
      - "tools/eos/api/server.py"
      - "tools/eos/auth/permission_namespace.py"
      - "tools/eos/auth/roles.py"
      - "tools/eos/auth/tenant_authorization.py"
      - "tests/unit/test_headcount_requisition_domain.py"
      - "tests/unit/test_headcount_requisition_registry.py"
      - "tests/unit/test_headcount_requisition_http_contract.py"
      - "tests/integration/test_headcount_requisition_registry_real_mongo.py"
      - ".github/workflows/headquarters-headcount-requisition.yml"

permissions:
  contents: read

jobs:
  headcount-requisition:
    name: Headcount state machine, persistence and IAM command tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEADCOUNT_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Start MongoDB replica-set container
        run: |
          docker run --detach --name headcount-mongo --publish 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
      - name: Initialize single-node MongoDB replica set
        run: |
          for attempt in $(seq 1 30); do
            if docker exec headcount-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then
              break
            fi
            sleep 2
          done
          docker exec headcount-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec headcount-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not become primary" >&2
          exit 1
      - name: Install governed Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.1.1
      - name: Compile requisition domain, registry and HTTP command
        run: |
          python -m py_compile \
            tools/eos/saas/domain/headcount_requisition.py \
            tools/eos/saas/hr/headcount_requisition_registry.py \
            tools/eos/api/headcount_requisition_router.py \
            tests/unit/test_headcount_requisition_domain.py \
            tests/unit/test_headcount_requisition_registry.py \
            tests/unit/test_headcount_requisition_http_contract.py \
            tests/integration/test_headcount_requisition_registry_real_mongo.py
      - name: Run headcount requisition domain, persistence, IAM and replica-set tests
        run: |
          python -m pytest -q \
            tests/unit/test_headcount_requisition_domain.py \
            tests/unit/test_headcount_requisition_registry.py \
            tests/unit/test_headcount_requisition_http_contract.py \
            tests/integration/test_headcount_requisition_registry_real_mongo.py
      - name: Stop MongoDB replica-set container
        if: always()
        run: docker rm --force headcount-mongo || true
