name: WILSY Headquarters Candidate and Offer Lifecycle

on:
  pull_request:
    paths:
      - "tools/eos/api/hiring_lifecycle_router.py"
      - "tools/eos/api/server.py"
      - "tools/eos/auth/permission_namespace.py"
      - "tools/eos/auth/tenant_authorization.py"
      - "tools/eos/auth/roles.py"
      - "tools/eos/saas/domain/hiring_lifecycle.py"
      - "tools/eos/saas/hr/hiring_lifecycle_registry.py"
      - "tests/unit/test_hiring_lifecycle_domain.py"
      - "tests/integration/test_hiring_lifecycle_registry_real_mongo.py"
      - "tests/integration/test_hiring_lifecycle_authenticated_http.py"
      - ".github/workflows/headquarters-hiring-candidate-offer.yml"

permissions:
  contents: read

jobs:
  candidate-offer-domain:
    name: Hiring IAM, HTTP and real MongoDB transaction certification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HIRING_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?replicaSet=rs0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Start MongoDB replica-set container
        run: docker run --detach --name hiring-mongo --publish 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
      - name: Initialize single-node MongoDB replica set
        run: |
          for attempt in $(seq 1 30); do
            if docker exec hiring-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1; then break; fi
            sleep 2
          done
          docker exec hiring-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec hiring-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then exit 0; fi
            sleep 2
          done
          echo "MongoDB replica set did not become primary" >&2
          exit 1
      - name: Install governed Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.1.1
      - name: Compile hiring command, IAM and persistence modules
        run: |
          python -m py_compile \
            tools/eos/api/hiring_lifecycle_router.py \
            tools/eos/api/server.py \
            tools/eos/auth/permission_namespace.py \
            tools/eos/auth/tenant_authorization.py \
            tools/eos/auth/roles.py \
            tools/eos/saas/domain/hiring_lifecycle.py \
            tools/eos/saas/hr/hiring_lifecycle_registry.py \
            tests/unit/test_hiring_lifecycle_domain.py \
            tests/integration/test_hiring_lifecycle_authenticated_http.py \
            tests/integration/test_hiring_lifecycle_registry_real_mongo.py
      - name: Run lifecycle, authenticated denial, IAM and real replica-set tests
        run: python -m pytest -q tests/unit/test_hiring_lifecycle_domain.py tests/integration/test_hiring_lifecycle_authenticated_http.py tests/integration/test_hiring_lifecycle_registry_real_mongo.py
      - name: Stop MongoDB replica-set container
        if: always()
        run: docker rm --force hiring-mongo || true
