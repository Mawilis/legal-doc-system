name: WILSY Headquarters Signed Offer Cryptographic Verification
on:
  pull_request:
    paths:
      - "tools/eos/api/hiring_lifecycle_router.py"
      - "tools/eos/saas/domain/hiring_lifecycle.py"
      - "tools/eos/saas/hr/signed_offer_cryptographic_verification.py"
      - "tests/unit/test_hiring_lifecycle_domain.py"
      - "tests/unit/test_signed_offer_cryptographic_verification.py"
      - "tests/integration/test_signed_offer_verification_real_mongo.py"
      - "tests/integration/test_signed_offer_verification_authenticated_http.py"
      - ".github/workflows/headquarters-signed-offer-cryptographic-verification.yml"
permissions:
  contents: read
jobs:
  signed-offer-cryptographic-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HIRING_TEST_MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.1.1
      - name: Start and initialize MongoDB replica set
        run: |
          docker run --detach --name signed-offer-mongo -p 27017:27017 mongo:7.0 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec signed-offer-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker exec signed-offer-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})' || true
          for attempt in $(seq 1 30); do
            if docker exec signed-offer-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not elect a primary" >&2
          exit 1
      - name: Compile cryptographic verifier and acceptance domain
        run: |
          python -m py_compile \
            tools/eos/api/hiring_lifecycle_router.py \
            tools/eos/saas/domain/hiring_lifecycle.py \
            tools/eos/saas/hr/signed_offer_cryptographic_verification.py \
            tests/unit/test_signed_offer_cryptographic_verification.py \
            tests/integration/test_signed_offer_verification_real_mongo.py \
            tests/integration/test_signed_offer_verification_authenticated_http.py
      - name: Run cryptographic, acceptance-domain and replica-set tests
        run: |
          python -m pytest -q \
            tests/unit/test_hiring_lifecycle_domain.py \
            tests/unit/test_signed_offer_cryptographic_verification.py \
            tests/integration/test_signed_offer_verification_real_mongo.py \
            tests/integration/test_signed_offer_verification_authenticated_http.py
