name: WILSY Headquarters Signed Offer Custody Gate

on:
  pull_request:
    paths:
      - "tools/eos/api/hiring_lifecycle_router.py"
      - "tools/eos/saas/domain/candidate_evidence.py"
      - "tools/eos/saas/hr/candidate_evidence_registry.py"
      - "tests/unit/test_hiring_lifecycle_domain.py"
      - "tests/unit/test_candidate_evidence_domain.py"
      - "tests/unit/test_candidate_evidence_s3_storage_adapter.py"
      - ".github/workflows/headquarters-signed-offer-custody.yml"

permissions:
  contents: read

jobs:
  signed-offer-custody:
    name: Signed-offer custody acceptance gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.1.1
      - name: Compile authenticated hiring and custody modules
        run: |
          python -m py_compile \
            tools/eos/api/hiring_lifecycle_router.py \
            tools/eos/saas/domain/candidate_evidence.py \
            tools/eos/saas/hr/candidate_evidence_registry.py \
            tools/eos/saas/hr/candidate_evidence_storage.py \
            tools/eos/saas/hr/candidate_evidence_s3_storage_adapter.py
      - name: Run hiring and evidence domain tests
        run: |
          python -m pytest -q \
            tests/unit/test_hiring_lifecycle_domain.py \
            tests/unit/test_candidate_evidence_domain.py \
            tests/unit/test_candidate_evidence_s3_storage_adapter.py
