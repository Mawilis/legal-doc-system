# TITLE: WILSY OS Headquarters Workforce Directory Certification
# VERSION: v1.1.1-M03-HR01-WORKFORCE-PYTEST-ENFORCED
# AUTHORITY: WILSY OS Core Governance; certification only.
# EPITOME: Certifies workforce authorization, synthetic UI, and disposable Mongo
#          without expanding real tenant or project assignment authority.
# ABSOLUTE CANONICAL PATH: /Users/wilsonkhanyezi/legal-doc-system/.github/workflows/headquarters-workforce-directory-certification.yml
# COLLABORATION / OWNERSHIP: Python EOS workforce authority and Headquarters client.
# CERTIFICATION / UPDATE DATE: 2026-11-27
# CHANGELOG: v1.1.1-M03-HR01-WORKFORCE-PYTEST-ENFORCED adds
#            the HR01 FastAPI regression test to the actual pytest invocation.
# CHANGELOG: v1.1.0-M03-HR01-EMPLOYEE-HTTP-SECURITY-CERT adds exact
#            employee registry/router code and authenticated HTTP boundary
#            regression tests to the current replica-backed workforce gate.
# CHANGELOG: v1.0.0-BOUNDED-CLIENT-RUNNER bounds the existing Vitest
#            certificate to one worker and 15-second individual test deadlines,
#            matching certified Daily Execution runner; assertions are unchanged.
# COMPLIANCE: AGENTS.md; POPIA section 19; GDPR Article 32; SOC 2 CC7.2.
# SECURITY / PRIVACY POSTURE: Synthetic fixtures and disposable database only.
# TENANT BOUNDARY: No tenant records are created or authorized.
# AUTHORITY BOUNDARY: Read-only certification; no IAM grants or admission.
# FINANCIAL AUTHORITY BOUNDARY: Kennel EOS remains exclusive.
# FAIL-CLOSED POSTURE: Any failing assertion, timeout or build blocks success.
name: WILSY Headquarters Workforce Directory Certification

on:
  pull_request:
    paths:
      - "tools/eos/api/hr_workforce_directory_router.py"
      - "tools/eos/api/employee_router.py"
      - "tools/eos/saas/employee/employee_registry.py"
      - "client/src/components/billing/BillingHUD.jsx"
      - "tests/unit/test_m03_hr01_employee_scope.py"
      - "tools/eos/api/server.py"
      - "tools/eos/auth/permission_namespace.py"
      - "tools/eos/auth/roles.py"
      - "tools/eos/auth/tenant_authorization.py"
      - "tools/eos/auth/tenant_authority_policy.py"
      - "tests/unit/test_hr_workforce_directory_router.py"
      - "tests/unit/test_hr_workforce_directory_authority.py"
      - "tests/unit/test_permission_namespace.py"
      - "tests/unit/test_tenant_authorization_http_workforce.py"
      - "tests/integration/test_tenant_authorization_http_workforce_real_mongo.py"
      - "client/src/components/workspaces/WilsyHeadquartersWorkspace.jsx"
      - "client/src/__tests__/components/WilsyHeadquartersWorkspace.test.jsx"
      - ".github/workflows/headquarters-workforce-directory-certification.yml"

permissions:
  contents: read

jobs:
  workforce-directory:
    name: Workforce directory policy, API and replica-set certification
    runs-on: ubuntu-latest
    timeout-minutes: 27
    env:
      TEST_VENDOR_MONGO_URI: mongodb://localhost:27017/?replicaSet=wilsyVendorCertRS
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install governed Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.1.1
      - name: Start and initialise disposable MongoDB replica set
        run: |
          docker run -d --name wilsy-workforce-mongo -p 27017:27017 mongo:7.0.37 mongod --replSet wilsyVendorCertRS --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec wilsy-workforce-mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep -q 1; then
              break
            fi
            sleep 2
          done
          docker exec wilsy-workforce-mongo mongosh --eval 'rs.initiate({_id:"wilsyVendorCertRS",members:[{_id:0,host:"localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec wilsy-workforce-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "Disposable replica set did not become writable"
          exit 1
      - name: Compile workforce authorization and route contracts
        run: |
          python -m py_compile \
            tools/eos/api/hr_workforce_directory_router.py \
            tools/eos/api/employee_router.py \
            tools/eos/saas/employee/employee_registry.py \
            tools/eos/api/server.py \
            tools/eos/auth/permission_namespace.py \
            tools/eos/auth/roles.py \
            tools/eos/auth/tenant_authorization.py \
            tools/eos/auth/tenant_authority_policy.py \
            tests/unit/test_hr_workforce_directory_router.py \
            tests/unit/test_hr_workforce_directory_authority.py \
            tests/unit/test_m03_hr01_employee_scope.py
      - name: Run focused workforce policy, HTTP and real-Mongo authorization tests
        run: |
          python -m pytest -q \
            tests/unit/test_hr_workforce_directory_router.py \
            tests/unit/test_hr_workforce_directory_authority.py \
            tests/unit/test_m03_hr01_employee_scope.py \
            tests/unit/test_permission_namespace.py \
            tests/unit/test_roles.py \
            tests/unit/test_tenant_authority_policy.py \
            tests/unit/test_tenant_authorization.py \
            tests/unit/test_tenant_authorization_http_workforce.py \
            tests/integration/test_tenant_authorization_http_workforce_real_mongo.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        working-directory: client
        run: npm ci --include=dev
      - name: Run Headquarters authenticated workspace component tests
        working-directory: client
        run: npx vitest run --config vitest.config.js --maxWorkers=1 --testTimeout=15000 src/__tests__/components/WilsyHeadquartersWorkspace.test.jsx
      - name: Build authenticated client
        working-directory: client
        run: npm run build

