    paths:
      - "tools/eos/auth/tenant_owner_bootstrap.py"
      - "tools/eos/auth/tenant_ownership_verifier.py"
      - "tools/eos/auth/tenant_ownership_evidence_registry.py"
      - "tools/eos/auth/tenant_ownership_lifecycle_command.py"
      - "tools/eos/auth/tenant_ownership_trust_root_registry.py"
      - "tools/eos/auth/tenant_ownership_provider_ports.py"
      - "tools/eos/auth/tenant_ownership_evidence_validation.py"
      - "tools/eos/auth/tenant_ownership_provider_composition.py"
      - "tests/unit/test_tenant_ownership_provider_composition.py"
      - "tests/integration/test_tenant_ownership_provider_composition_real_mongo.py"
      - "tests/unit/test_tenant_ownership_provider_ports.py"
      - "tests/unit/test_tenant_ownership_evidence_validation.py"
      - "tests/integration/test_tenant_ownership_recovery_replay_real_mongo.py"
      - "tools/eos/auth/tenant_ownership_transfer_protocol.py"
      - "tools/eos/api/tenant_router.py"
      - "tools/eos/api/legal_operations_router.py"
      - "tests/unit/test_tenant_owner_bootstrap.py"
      - "tests/unit/test_tenant_ownership_verifier.py"
      - "tests/unit/test_tenant_ownership_evidence_registry.py"
      - "tests/unit/test_tenant_ownership_lifecycle_command.py"
      - "tests/unit/test_tenant_ownership_trust_root_registry.py"
      - "tests/unit/test_tenant_ownership_transfer_protocol.py"
      - "tests/integration/test_tenant_ownership_evidence_registry_real_mongo.py"
      - "tests/integration/test_tenant_ownership_governance_transfer_real_mongo.py"
      - "tests/unit/test_tenant_router_fail_closed.py"
      - "tests/unit/test_tenant_ownership_readiness_router.py"
      - "tests/integration/test_tenant_router_get_archive_real_mongo.py"
      - "tests/unit/test_legal_practice_workspace_confidentiality_boundary.py"
      - "tests/integration/test_tenant_owner_bootstrap_real_mongo.py"
      - "tests/integration/test_legal_operations_practice_workspace_http.py"
      - "tests/integration/test_legal_operations_practice_workspace_real_mongo.py"
      - ".github/workflows/issue-300-ownership-safe-block-certification.yml"
  push:
    branches: [main, issue-300-tenant-ownership]
    paths:
      - "tools/eos/auth/tenant_owner_bootstrap.py"
      - "tools/eos/auth/tenant_ownership_verifier.py"
      - "tools/eos/auth/tenant_ownership_evidence_registry.py"
      - "tools/eos/auth/tenant_ownership_lifecycle_command.py"
      - "tools/eos/auth/tenant_ownership_trust_root_registry.py"
      - "tools/eos/auth/tenant_ownership_provider_ports.py"
      - "tools/eos/auth/tenant_ownership_evidence_validation.py"
      - "tools/eos/auth/tenant_ownership_provider_composition.py"
      - "tests/unit/test_tenant_ownership_provider_composition.py"
      - "tests/integration/test_tenant_ownership_provider_composition_real_mongo.py"
      - "tests/unit/test_tenant_ownership_provider_ports.py"
      - "tests/unit/test_tenant_ownership_evidence_validation.py"
      - "tests/integration/test_tenant_ownership_recovery_replay_real_mongo.py"
      - "tools/eos/auth/tenant_ownership_transfer_protocol.py"
      - "tools/eos/api/tenant_router.py"
      - "tools/eos/api/legal_operations_router.py"
      - "tests/unit/test_tenant_owner_bootstrap.py"
      - "tests/unit/test_tenant_ownership_verifier.py"
      - "tests/unit/test_tenant_ownership_evidence_registry.py"
      - "tests/unit/test_tenant_ownership_lifecycle_command.py"
      - "tests/unit/test_tenant_ownership_trust_root_registry.py"
      - "tests/unit/test_tenant_ownership_transfer_protocol.py"
      - "tests/integration/test_tenant_ownership_evidence_registry_real_mongo.py"
      - "tests/integration/test_tenant_ownership_governance_transfer_real_mongo.py"
      - "tests/unit/test_tenant_router_fail_closed.py"
      - "tests/unit/test_tenant_ownership_readiness_router.py"
      - "tests/integration/test_tenant_router_get_archive_real_mongo.py"
      - "tests/unit/test_legal_practice_workspace_confidentiality_boundary.py"
      - "tests/integration/test_tenant_owner_bootstrap_real_mongo.py"
      - "tests/integration/test_legal_operations_practice_workspace_http.py"
      - "tests/integration/test_legal_operations_practice_workspace_real_mongo.py"
      - ".github/workflows/issue-300-ownership-safe-block-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue-300-safe-block:
    name: Issue 300 deny-only ownership and workspace gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_VENDOR_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=wilsyVendorCertRS
      WILSY_ISSUE_300_REAL_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=wilsyVendorCertRS
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node for pinned Pyright
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pinned repository runtime and certification dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install -r requirements.txt pytest==9.1.1

      - name: Compile Issue 300 Python surfaces
        run: |
          python -m py_compile \
            tools/eos/auth/tenant_owner_bootstrap.py  \
            tools/eos/auth/tenant_ownership_verifier.py  \
            tools/eos/auth/tenant_ownership_evidence_registry.py  \
            tools/eos/auth/tenant_ownership_lifecycle_command.py  \
            tools/eos/auth/tenant_ownership_trust_root_registry.py  \
            tools/eos/auth/tenant_ownership_provider_ports.py  \
            tools/eos/auth/tenant_ownership_evidence_validation.py  \
            tools/eos/auth/tenant_ownership_provider_composition.py  \
            tools/eos/auth/tenant_ownership_transfer_protocol.py  \
            tools/eos/api/legal_operations_router.py  \
            tests/unit/test_tenant_owner_bootstrap.py  \
            tests/unit/test_tenant_ownership_verifier.py  \
            tests/unit/test_tenant_ownership_evidence_registry.py  \
            tests/unit/test_tenant_ownership_lifecycle_command.py  \
            tests/unit/test_tenant_ownership_trust_root_registry.py  \
            tests/unit/test_tenant_ownership_provider_ports.py  \
            tests/unit/test_tenant_ownership_evidence_validation.py  \
            tests/unit/test_tenant_ownership_provider_composition.py  \
            tests/integration/test_tenant_ownership_recovery_replay_real_mongo.py  \
            tests/integration/test_tenant_ownership_provider_composition_real_mongo.py  \
            tests/unit/test_tenant_ownership_transfer_protocol.py  \
            tests/integration/test_tenant_ownership_evidence_registry_real_mongo.py  \
            tests/integration/test_tenant_ownership_governance_transfer_real_mongo.py  \
            tests/unit/test_tenant_router_fail_closed.py  \
            tests/unit/test_legal_practice_workspace_confidentiality_boundary.py  \
            tests/integration/test_tenant_owner_bootstrap_real_mongo.py  \
            tests/integration/test_legal_operations_practice_workspace_http.py  \
            tests/integration/test_legal_operations_practice_workspace_real_mongo.py \
            tools/eos/api/tenant_router.py \
            tests/unit/test_tenant_ownership_readiness_router.py \
            tests/integration/test_tenant_router_get_archive_real_mongo.py

      - name: Type-check Issue 300 ownership and workspace gates
        run: |
          npx --yes pyright@1.1.413 \
            --pythonpath "$(command -v python)" \
            tools/eos/auth/tenant_owner_bootstrap.py  \
            tools/eos/auth/tenant_ownership_verifier.py  \
            tools/eos/auth/tenant_ownership_evidence_registry.py  \
            tools/eos/auth/tenant_ownership_lifecycle_command.py  \
            tools/eos/auth/tenant_ownership_trust_root_registry.py  \
            tools/eos/auth/tenant_ownership_provider_ports.py  \
            tools/eos/auth/tenant_ownership_evidence_validation.py  \
            tools/eos/auth/tenant_ownership_provider_composition.py  \
            tools/eos/auth/tenant_ownership_transfer_protocol.py  \
            tools/eos/api/legal_operations_router.py  \
            tests/unit/test_tenant_owner_bootstrap.py  \
            tests/unit/test_tenant_ownership_verifier.py  \
            tests/unit/test_tenant_ownership_evidence_registry.py  \
            tests/unit/test_tenant_ownership_lifecycle_command.py  \
            tests/unit/test_tenant_ownership_trust_root_registry.py  \
            tests/unit/test_tenant_ownership_provider_ports.py  \
            tests/unit/test_tenant_ownership_evidence_validation.py  \
            tests/unit/test_tenant_ownership_provider_composition.py  \
            tests/unit/test_tenant_ownership_transfer_protocol.py  \
            tests/integration/test_tenant_ownership_evidence_registry_real_mongo.py  \
            tests/integration/test_tenant_ownership_governance_transfer_real_mongo.py  \
            tests/integration/test_tenant_ownership_recovery_replay_real_mongo.py  \
            tests/integration/test_tenant_ownership_provider_composition_real_mongo.py  \
            tests/unit/test_tenant_router_fail_closed.py  \
            tests/unit/test_legal_practice_workspace_confidentiality_boundary.py  \
            tests/integration/test_tenant_owner_bootstrap_real_mongo.py  \
            tests/integration/test_legal_operations_practice_workspace_http.py  \
            tests/integration/test_legal_operations_practice_workspace_real_mongo.py \
            tools/eos/api/tenant_router.py \
            tests/unit/test_tenant_ownership_readiness_router.py \

      - name: Run focused unit and HTTP denial certificates
        run: |
          python -m pytest -q -rs \
            tests/unit/test_tenant_owner_bootstrap.py \
            tests/unit/test_tenant_ownership_verifier.py \
            tests/unit/test_tenant_ownership_evidence_registry.py \
            tests/unit/test_tenant_ownership_lifecycle_command.py \
            tests/unit/test_tenant_ownership_trust_root_registry.py \
            tests/unit/test_tenant_ownership_provider_ports.py \
            tests/unit/test_tenant_ownership_evidence_validation.py \
            tests/unit/test_tenant_ownership_provider_composition.py \
            tests/unit/test_tenant_ownership_transfer_protocol.py \
            tests/unit/test_tenant_router_fail_closed.py \
            tests/unit/test_tenant_ownership_readiness_router.py \
            tests/unit/test_legal_practice_workspace_confidentiality_boundary.py \
            tests/integration/test_legal_operations_practice_workspace_http.py

      - name: Start disposable loopback Mongo replica set
        run: |
          docker run \
            --detach \
            --name wilsy-issue-300-cert-mongo \
            --publish 127.0.0.1:27017:27017 \
            mongo:7.0.37 \
            mongod \
            --replSet wilsyVendorCertRS \
            --bind_ip_all

      - name: Initialize and verify disposable Mongo primary
        run: |
          python - <<'PY'
          import time

          from pymongo import MongoClient

          client = MongoClient(
              "mongodb://127.0.0.1:27017",
              directConnection=True,
              serverSelectionTimeoutMS=2_000,
          )
          deadline = time.monotonic() + 60
          initiated = False
          last_error = None

          while True:
              try:
                  hello = client.admin.command("hello")
                  if not initiated and not hello.get("setName"):
                      client.admin.command(
                          {
                              "replSetInitiate": {
                                  "_id": "wilsyVendorCertRS",
                                  "members": [
                                      {"_id": 0, "host": "127.0.0.1:27017"}
                                  ],
                              }
                          }
                      )
                      initiated = True

                  hello = client.admin.command("hello")
                  if (
                      hello.get("setName") == "wilsyVendorCertRS"
                      and hello.get("isWritablePrimary") is True
                      and hello.get("logicalSessionTimeoutMinutes") is not None
                  ):
                      break
              except Exception as error:
                  last_error = error

              if time.monotonic() >= deadline:
                  raise RuntimeError(
                      "ISSUE_300_DISPOSABLE_MONGO_PRIMARY_UNAVAILABLE: "
                      f"{last_error!r}"
                  ) from last_error
              time.sleep(1)

          client.close()
          PY

      - name: Run workspace and owner-bootstrap real-Mongo certificates
        run: |
          python -m pytest -q -rs \
            tests/integration/test_tenant_owner_bootstrap_real_mongo.py \
            tests/integration/test_tenant_ownership_evidence_registry_real_mongo.py \
            tests/integration/test_tenant_ownership_governance_transfer_real_mongo.py \
            tests/integration/test_tenant_ownership_recovery_replay_real_mongo.py \
            tests/integration/test_tenant_ownership_provider_composition_real_mongo.py \
            tests/integration/test_tenant_router_get_archive_real_mongo.py \
            tests/integration/test_legal_operations_practice_workspace_real_mongo.py

      - name: Remove disposable Mongo container
        if: always()
        run: docker rm -f wilsy-issue-300-cert-mongo 2>/dev/null || true
