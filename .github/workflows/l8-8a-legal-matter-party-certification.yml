name: L8-8A Legal Matter Party Certification

on:
  push:
    branches:
      - legal-ops-completion-map
    paths:
      - "tools/eos/legal_operations/domain/legal_matter_party.py"
      - "tests/unit/test_legal_matter_party.py"
      - ".github/workflows/l8-8a-legal-matter-party-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l8-8a-domain:
    name: L8-8A direct and static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node for pinned Pyright
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install bounded dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install pytest==9.1.1 pymongo==4.16.0
      - name: Compile exact L8-8A surfaces
        run: |
          python -m py_compile \
            tools/eos/legal_operations/domain/legal_matter_party.py \
            tests/unit/test_legal_matter_party.py
      - name: Type-check exact L8-8A surfaces
        run: |
          npx --yes pyright@1.1.413 \
            --pythonpath "$(command -v python)" \
            tools/eos/legal_operations/domain/legal_matter_party.py \
            tests/unit/test_legal_matter_party.py
      - name: Run exact L8-8A direct certificate with no skips
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output="$(python -m pytest -q -rs tests/unit/test_legal_matter_party.py 2>&1)"
          pytest_status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$pytest_status" -ne 0 ]; then exit "$pytest_status"; fi
          printf '%s\n' "$output" | grep -Eq '18 passed'
          if printf '%s\n' "$output" | grep -qi 'skipped'; then
            echo "L8-8A certification invalid: skipped tests detected"
            exit 1
          fi
