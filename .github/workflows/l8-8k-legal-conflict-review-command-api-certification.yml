name: L8-8K Legal Conflict Review Command API Certification

on:
  push:
    branches:
      - legal-ops-completion-map
    paths:
      - "tools/eos/api/legal_operations_command_router.py"
      - "tools/eos/legal_operations/orchestration/legal_conflict_review_orchestrator.py"
      - "tests/unit/test_legal_conflict_review_command_router.py"
      - ".github/workflows/l8-8k-legal-conflict-review-command-api-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l8-8k-command-api:
    name: L8-8K command API direct and static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node for pinned Pyright
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install bounded runtime and certificate dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1 pyotp==2.9.0
      - name: Compile exact L8-8K surfaces
        run: |
          python -m py_compile \
            tools/eos/api/legal_operations_command_router.py \
            tools/eos/legal_operations/orchestration/legal_conflict_review_orchestrator.py \
            tests/unit/test_legal_conflict_review_command_router.py
      - name: Type-check exact L8-8K surfaces
        run: |
          npx --yes pyright@1.1.413 \
            --pythonpath "$(command -v python)" \
            tools/eos/api/legal_operations_command_router.py \
            tools/eos/legal_operations/orchestration/legal_conflict_review_orchestrator.py \
            tests/unit/test_legal_conflict_review_command_router.py
      - name: Run exact L8-8K direct certificate with no skips
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output="$(python -m pytest -q -rs tests/unit/test_legal_conflict_review_command_router.py 2>&1)"
          pytest_status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$pytest_status" -ne 0 ]; then
            exit "$pytest_status"
          fi
          printf '%s\n' "$output" | grep -Eq '12 passed'
          if printf '%s\n' "$output" | grep -qi 'skipped'; then
            echo "L8-8K certification invalid: skipped tests detected"
            exit 1
          fi
