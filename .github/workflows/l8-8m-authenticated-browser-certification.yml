# TITLE: L8-8M and D21B13 authenticated browser/branding certification
# VERSION: v1.0.6-L8-8M-ROUTE-COMPOSITION-CERT
# AUTHORITY: Disposable certification orchestration only.
# EPITOME: Run the authenticated Legal browser suite and the independent real-Mongo
#          branding delivery integration certificate against isolated replica sets.
# ABSOLUTE CANONICAL PATH: /Users/wilsonkhanyezi/legal-doc-system/.github/workflows/l8-8m-authenticated-browser-certification.yml
# COLLABORATION / OWNERSHIP: EOS owns auth, tenant and asset truth; CI owns only
#                            disposable setup, test orchestration and teardown.
# CERTIFICATION / UPDATE DATE: 2026-10-24
# CHANGELOG: v1.0.6 runs the browser preflight on server app/router composition changes so route-mount regressions cannot bypass this certificate.
#            v1.0.5 applies the repository's established legacy-peer-deps install mode to the server lockfile; the exact-revision browser workflow failed before certification because compromise-ngrams@0.0.6 declares compromise ^12 while the lockfile resolves compromise 14. The workflow also runs on the dedicated G65 revocation-fence branch so this certification can execute without a manual dispatch.
#            v1.0.4 installs the server BFF lockfile before the browser runner starts its owned BFF.
#            v1.0.3 installs the repository-pinned pytest runner required by the real-Mongo
#            branding integration step after CI confirmed it was absent from runtime deps.
#            v1.0.2 aligns branding Mongo listener/member ports; v1.0.1 adds isolated Mongo,
#            focused client checks, UUID browser DB, skip rejection, and unconditional cleanup.
# TENANT BOUNDARY: Synthetic fixture tenants and per-run disposable databases only.
# AUTHORITY BOUNDARY: Certification orchestration; no production authority.
# FINANCIAL AUTHORITY BOUNDARY: Kennel EOS remains exclusive.
# COMPLIANCE: POPIA section 19; GDPR Article 32; SOC 2 CC7.2.
# SECURITY / PRIVACY POSTURE: Disposable synthetic fixtures only; no production
#                             database or real-user credentials are configured.

name: L8-8M Authenticated Browser and D21B13 Branding Certification

on:
  push:
    branches:
      - legal-ops-completion-map
      - feat/g65-revocation-fence-protocol
      - fix/browser-cert-route-composition
    paths:
      - "tests/e2e/playwright.config.js"
      - "tests/e2e/**"
      - "tests/integration/test_tenant_branding_workspace_asset_delivery_real_mongo.py"
      - "client/src/components/industry/LegalDashboard.jsx"
      - "client/src/components/os/WilsyOSDashboardChrome.jsx"
      - "client/src/components/os/wilsyDashboardChromeConfig.js"
      - "client/src/hooks/useAuthenticatedTenantBrandingAsset.js"
      - "client/src/services/tenantBrandingAssetClient.js"
      - "client/src/__tests__/components/legalDashboardBrandingPresentation.test.jsx"
      - "client/tests/hooks/useAuthenticatedTenantBrandingAsset.test.jsx"
      - "client/tests/services/tenantBrandingAssetClient.test.js"
      - "tools/eos/api/auth_router.py"
      - "tools/eos/auth/workspace_bootstrap_projection.py"
      - "tools/eos/auth/tenant_branding_workspace_asset_delivery.py"
      - "tools/eos/auth/tenant_branding_workspace_projection.py"
      - "tools/eos/saas/billing/tenant_branding_*.py"
      - "tools/eos/saas/domain/tenant_branding_*.py"
      - "package.json"
      - "package-lock.json"
      - "server/app.js"
      - "server/routes/telemetryRoutes.js"
      - "server/routes/forensicRoutes.js"
      - "tests/e2e/run-browser-cert.mjs"
      - ".github/workflows/l8-8m-authenticated-browser-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l8-8m-browser:
    name: Authenticated Legal browser and D21B13 branding certificate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install -r requirements.txt
          python -m pip install pyotp==2.9.0 pytest==9.1.1

      - name: Install exact Node lockfiles
        run: |
          npm ci --legacy-peer-deps
          npm --prefix client ci
          npm --prefix server ci --legacy-peer-deps

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Start disposable browser-cert Mongo replica set
        run: |
          docker run --detach \
            --name wilsy-l8-8m-browser-mongo \
            --publish 27017:27017 \
            mongo:7.0.37 \
            mongod --replSet wilsyVendorCertRS --bind_ip_all

      - name: Initialize browser-cert Mongo replica set
        run: |
          python - <<'PY'
          import time
          from pymongo import MongoClient

          client = MongoClient(
              "mongodb://127.0.0.1:27017",
              directConnection=True,
              serverSelectionTimeoutMS=2_000,
          )
          deadline = time.monotonic() + 60
          initiated = False
          while True:
              try:
                  hello = client.admin.command("hello")
                  if not initiated and not hello.get("setName"):
                      client.admin.command({
                          "replSetInitiate": {
                              "_id": "wilsyVendorCertRS",
                              "members": [{"_id": 0, "host": "127.0.0.1:27017"}],
                          }
                      })
                      initiated = True
                  hello = client.admin.command("hello")
                  if (
                      hello.get("setName") == "wilsyVendorCertRS"
                      and hello.get("isWritablePrimary") is True
                      and hello.get("logicalSessionTimeoutMinutes") is not None
                  ):
                      break
              except Exception:
                  pass
              if time.monotonic() >= deadline:
                  raise RuntimeError("L8_8M_BROWSER_MONGO_UNAVAILABLE")
              time.sleep(1)
          client.close()
          PY

      - name: Start isolated D21B13 real-Mongo replica set
        run: |
          docker run --detach \
            --name wilsy-d21b13-branding-mongo \
            --publish 27018:27018 \
            mongo:7.0.37 \
            mongod --port 27018 --replSet wilsyVendorCertRS --bind_ip_all

      - name: Initialize D21B13 real-Mongo replica set
        run: |
          python - <<'PY'
          import time
          from pymongo import MongoClient

          client = MongoClient(
              "mongodb://127.0.0.1:27018",
              directConnection=True,
              serverSelectionTimeoutMS=2_000,
          )
          deadline = time.monotonic() + 60
          initiated = False
          while True:
              try:
                  hello = client.admin.command("hello")
                  if not initiated and not hello.get("setName"):
                      client.admin.command({
                          "replSetInitiate": {
                              "_id": "wilsyVendorCertRS",
                              "members": [{"_id": 0, "host": "127.0.0.1:27018"}],
                          }
                      })
                      initiated = True
                  hello = client.admin.command("hello")
                  if (
                      hello.get("setName") == "wilsyVendorCertRS"
                      and hello.get("isWritablePrimary") is True
                      and hello.get("logicalSessionTimeoutMinutes") is not None
                  ):
                      break
              except Exception:
                  pass
              if time.monotonic() >= deadline:
                  raise RuntimeError("D21B13_BRANDING_MONGO_UNAVAILABLE")
              time.sleep(1)
          client.close()
          PY

      - name: Compile browser fixture
        run: python -m py_compile tests/e2e/browser_cert_fixture.py

      - name: Run focused D21B12 client lifecycle regressions
        run: >-
          npm --prefix client run test:run --
          src/__tests__/components/legalDashboardBrandingPresentation.test.jsx
          tests/services/tenantBrandingAssetClient.test.js
          tests/hooks/useAuthenticatedTenantBrandingAsset.test.jsx

      - name: Run D21B10 real-Mongo branding delivery certificate
        env:
          TEST_VENDOR_MONGO_URI: mongodb://127.0.0.1:27018/?replicaSet=wilsyVendorCertRS
        run: |
          set +e
          python -m pytest -q -rs \
            --junitxml=/tmp/d21b13-branding-real-mongo.xml \
            tests/integration/test_tenant_branding_workspace_asset_delivery_real_mongo.py
          pytest_status=$?
          set -e
          if [ "$pytest_status" -ne 0 ]; then
            exit "$pytest_status"
          fi
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("/tmp/d21b13-branding-real-mongo.xml").getroot()
          skipped = sum(
              int(suite.attrib.get("skipped", "0"))
              for suite in root.iter("testsuite")
          )
          tests = sum(
              int(suite.attrib.get("tests", "0"))
              for suite in root.iter("testsuite")
          )
          if tests < 1 or skipped:
              raise SystemExit(
                  f"D21B13_REAL_MONGO_CERTIFICATE_INVALID: tests={tests}, skipped={skipped}"
              )
          print(f"D21B13 real-Mongo branding tests executed: {tests}; skipped: 0")
          PY

      - name: Run authenticated browser certificate
        run: |
          browser_cert_database_suffix="$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          BROWSER_CERT_MONGO_URI="mongodb://127.0.0.1:27017/wilsy_l8_8m_r3_${browser_cert_database_suffix}?replicaSet=wilsyVendorCertRS" \
            node tests/e2e/run-browser-cert.mjs

      - name: Stop disposable Mongo replica sets
        if: always()
        run: |
          docker info >/dev/null
          for name in wilsy-l8-8m-browser-mongo wilsy-d21b13-branding-mongo; do
            container_id="$(docker ps --all --quiet --filter "name=^/${name}$")"
            if [ -n "$container_id" ]; then
              docker rm --force "$container_id"
            fi
          done

