name: L8-8M Authenticated Browser Certification

on:
  push:
    branches:
      - legal-ops-completion-map
    paths:
      - "tests/e2e/playwright.config.js"
      - "tests/e2e/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/l8-8m-authenticated-browser-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l8-8m-browser:
    name: L8-8M authenticated Legal OS browser certificate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSER_CERT_MONGO_URI: mongodb://127.0.0.1:27017/wilsy_l8_8m_ci?replicaSet=wilsyVendorCertRS
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python runtime
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install -r requirements.txt
          python -m pip install pyotp==2.9.0

      - name: Install exact Node lockfiles
        run: |
          npm ci --legacy-peer-deps
          npm --prefix client ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Start disposable Mongo replica set
        run: |
          docker run --detach \
            --name wilsy-l8-8m-browser-mongo \
            --publish 27017:27017 \
            mongo:7.0.37 \
            mongod --replSet wilsyVendorCertRS --bind_ip_all

      - name: Initialize Mongo replica set
        run: |
          python - <<'PY'
          import time
          from pymongo import MongoClient

          client = MongoClient(
              "mongodb://127.0.0.1:27017",
              directConnection=True,
              serverSelectionTimeoutMS=2_000,
          )
          deadline = time.monotonic() + 60
          initiated = False
          while True:
              try:
                  hello = client.admin.command("hello")
                  if not initiated and not hello.get("setName"):
                      client.admin.command({
                          "replSetInitiate": {
                              "_id": "wilsyVendorCertRS",
                              "members": [{"_id": 0, "host": "127.0.0.1:27017"}],
                          }
                      })
                      initiated = True
                  hello = client.admin.command("hello")
                  if (
                      hello.get("setName") == "wilsyVendorCertRS"
                      and hello.get("isWritablePrimary") is True
                      and hello.get("logicalSessionTimeoutMinutes") is not None
                  ):
                      break
              except Exception:
                  pass
              if time.monotonic() >= deadline:
                  raise RuntimeError("L8_8M_BROWSER_MONGO_UNAVAILABLE")
              time.sleep(1)
          client.close()
          PY

      - name: Compile browser fixture
        run: |
          python -m py_compile tests/e2e/browser_cert_fixture.py

      - name: Run authenticated browser certificate
        run: node tests/e2e/run-browser-cert.mjs

      - name: Stop disposable Mongo
        if: always()
        run: docker rm --force wilsy-l8-8m-browser-mongo

# ARTIFACT: l8-8m-authenticated-browser-certification.yml
# VERSION: v1.0.0-L8-8M-R3-BROWSER-CERT-WORKFLOW
# AUTHORITY BOUNDARY: disposable CI browser certification only
# TENANT POSTURE: UUID-isolated fixture database; no production URI
# FAIL-CLOSED POSTURE: browser, service, fixture, and Mongo failures fail the job
# FINANCIAL EXECUTION AUTHORITY: Kennel EOS remains exclusive
# END OF WILSY OS SOVEREIGN ARTIFACT
