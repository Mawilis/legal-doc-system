# WILSY OS Matter Acceptance Instrument Approval Issuance Certification Workflow
# VERSION: v1.0.0-L9A4-P2B3-MATTER-ACCEPTANCE-INSTRUMENT-APPROVAL-ISSUANCE-CERT-WORKFLOW
# AUTHORITY: Wilsy OS Core Governance
# EPITOME: Certify the dedicated IAM binding and caller-owned approval
#          orchestrator against pure fakes and an isolated Mongo replica set.
# TENANT / AUTHORITY BOUNDARY: Synthetic identities and UUID database only;
#                              no client acceptance, engagement, representation,
#                              Court, payment, execution or settlement authority.
# CHANGELOG: v1.0.0-L9A4-P2B3 adds bounded compile, Pyright, unit and
#            disposable real-Mongo approval-issuance certification.
# COMPLIANCE: POPIA section 19; GDPR Article 32; SOC 2 CC7.2; ISO 27001.

name: L9A4-P2B3 Matter Acceptance Instrument Approval Issuance Certification

on:
  push:
    branches:
      - legal-ops-completion-map
    paths:
      - "tools/eos/auth/permission_namespace.py"
      - "tools/eos/auth/roles.py"
      - "tools/eos/auth/tenant_authority_policy.py"
      - "tools/eos/auth/tenant_authorization.py"
      - "tools/eos/legal_operations/orchestration/legal_client_matter_acceptance_instrument_approval_orchestrator.py"
      - "tests/unit/test_permission_namespace.py"
      - "tests/unit/test_roles.py"
      - "tests/unit/test_tenant_authority_policy.py"
      - "tests/unit/test_tenant_authorization.py"
      - "tests/unit/test_legal_client_matter_acceptance_instrument_approval_orchestrator.py"
      - "tests/integration/test_legal_client_matter_acceptance_instrument_approval_orchestrator_real_mongo.py"
      - ".github/workflows/l9a4-p2b3-matter-acceptance-instrument-approval-issuance-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct:
    name: L9A4-P2B3 direct and static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node for pinned Pyright
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install bounded dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install pytest==9.1.1 pymongo==4.16.0 pydantic==2.11.7
      - name: Compile exact P2B3 surfaces
        run: |
          python -m py_compile \
            tools/eos/auth/permission_namespace.py \
            tools/eos/auth/roles.py \
            tools/eos/auth/tenant_authority_policy.py \
            tools/eos/auth/tenant_authorization.py \
            tools/eos/legal_operations/orchestration/legal_client_matter_acceptance_instrument_approval_orchestrator.py \
            tests/unit/test_permission_namespace.py \
            tests/unit/test_roles.py \
            tests/unit/test_tenant_authority_policy.py \
            tests/unit/test_tenant_authorization.py \
            tests/unit/test_legal_client_matter_acceptance_instrument_approval_orchestrator.py
      - name: Type-check exact P2B3 surfaces
        run: |
          npx --yes pyright@1.1.413 \
            --pythonpath "$(command -v python)" \
            tools/eos/auth/permission_namespace.py \
            tools/eos/auth/roles.py \
            tools/eos/auth/tenant_authority_policy.py \
            tools/eos/auth/tenant_authorization.py \
            tools/eos/legal_operations/orchestration/legal_client_matter_acceptance_instrument_approval_orchestrator.py \
            tests/unit/test_legal_client_matter_acceptance_instrument_approval_orchestrator.py
      - name: Run direct certificates with no skips
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output="$(python -m pytest -q -rs \
            tests/unit/test_permission_namespace.py \
            tests/unit/test_roles.py \
            tests/unit/test_tenant_authority_policy.py \
            tests/unit/test_tenant_authorization.py \
            tests/unit/test_legal_client_matter_acceptance_instrument_approval_orchestrator.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if printf '%s\n' "$output" | grep -qi 'skipped'; then exit 1; fi

  real-mongo:
    name: L9A4-P2B3 isolated real-Mongo
    runs-on: ubuntu-latest
    needs: [direct]
    timeout-minutes: 25
    env:
      TEST_VENDOR_MONGO_URI: mongodb://localhost:27017/?replicaSet=wilsyVendorCertRS
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node for pinned Pyright
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install bounded dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install pytest==9.1.1 pymongo==4.16.0 pydantic==2.11.7
      - name: Compile and type-check real-Mongo surface
        run: |
          python -m py_compile \
            tools/eos/legal_operations/orchestration/legal_client_matter_acceptance_instrument_approval_orchestrator.py \
            tests/integration/test_legal_client_matter_acceptance_instrument_approval_orchestrator_real_mongo.py
          npx --yes pyright@1.1.413 \
            --pythonpath "$(command -v python)" \
            tools/eos/legal_operations/orchestration/legal_client_matter_acceptance_instrument_approval_orchestrator.py \
            tests/integration/test_legal_client_matter_acceptance_instrument_approval_orchestrator_real_mongo.py
      - name: Start disposable Mongo replica set
        run: |
          docker run --detach --name wilsy-l9a4-p2b3-approval-orchestrator-mongo \
            --publish 27017:27017 mongo:7.0.37 mongod --replSet wilsyVendorCertRS --bind_ip_all
      - name: Initialize Mongo replica set
        run: |
          python - <<'PY'
          import time
          from pymongo import MongoClient
          client = MongoClient("mongodb://localhost:27017", directConnection=True, serverSelectionTimeoutMS=2000)
          deadline = time.monotonic() + 60
          initiated = False
          while True:
              try:
                  hello = client.admin.command("hello")
                  if not initiated and not hello.get("setName"):
                      client.admin.command({"replSetInitiate": {"_id": "wilsyVendorCertRS", "members": [{"_id": 0, "host": "localhost:27017"}]}})
                      initiated = True
                  hello = client.admin.command("hello")
                  if hello.get("setName") == "wilsyVendorCertRS" and hello.get("isWritablePrimary") is True and hello.get("logicalSessionTimeoutMinutes") is not None:
                      break
              except Exception:
                  pass
              if time.monotonic() >= deadline:
                  raise RuntimeError("L9A4_P2B3_CI_MONGO_UNAVAILABLE")
              time.sleep(1)
          client.close()
          PY
      - name: Run real-Mongo certificate with no skips
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output="$(python -m pytest -q -rs tests/integration/test_legal_client_matter_acceptance_instrument_approval_orchestrator_real_mongo.py 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if printf '%s\n' "$output" | grep -qi 'skipped'; then exit 1; fi
      - name: Stop disposable Mongo
        if: always()
        run: docker rm -f wilsy-l9a4-p2b3-approval-orchestrator-mongo 2>/dev/null || true

