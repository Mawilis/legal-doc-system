# WILSY OS L9A4-P2E / L9A3-R1 certification workflow.
# This workflow certifies context-bound acceptance issuance only. It creates no
# browser, Engagement, Representation, Court or financial authority.
name: L9A4-P2E L9A3 Client Acceptance Authority Narrowing Certification

on:
  push:
    branches:
      - legal-ops-completion-map
    paths:
      - "tools/eos/legal_operations/orchestration/legal_client_acceptance_orchestrator.py"
      - "tests/unit/test_legal_client_acceptance_orchestrator.py"
      - "tests/integration/test_legal_client_acceptance_orchestrator_real_mongo.py"
      - ".github/workflows/l9a4-p2e-l9a3-client-acceptance-authority-narrowing-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2e-direct:
    name: L9A4-P2E direct and static
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup Node for pinned Pyright
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install bounded dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install pytest==9.1.1 pymongo==4.18.2 pydantic==2.11.7
      - name: Compile narrowed acceptance surfaces
        run: |
          python -m py_compile \
            tools/eos/legal_operations/orchestration/legal_client_acceptance_orchestrator.py \
            tests/unit/test_legal_client_acceptance_orchestrator.py
      - name: Type-check narrowed acceptance surfaces
        run: |
          npx --yes pyright@1.1.413 \
            --pythonpath "$(command -v python)" \
            tools/eos/legal_operations/orchestration/legal_client_acceptance_orchestrator.py \
            tests/unit/test_legal_client_acceptance_orchestrator.py
      - name: Run direct certificate and predecessor regressions without skips
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output="$(python -m pytest -q -rs \
            tests/unit/test_legal_client_acceptance_orchestrator.py \
            tests/unit/test_legal_client_acceptance.py \
            tests/unit/test_legal_client_acceptance_registry.py \
            tests/unit/test_legal_client_acceptance_context.py \
            tests/unit/test_legal_client_acceptance_context_orchestrator.py \
            tests/unit/test_legal_client_acceptance_context_registry.py \
            tests/unit/test_legal_client_acceptance_content_service.py 2>&1)"
          pytest_status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$pytest_status" -ne 0 ]; then exit "$pytest_status"; fi
          if printf '%s\n' "$output" | grep -qi 'skipped'; then
            echo "L9A4-P2E direct certification invalid: skipped tests detected"
            exit 1
          fi

  p2e-real-mongo:
    name: L9A4-P2E real-Mongo
    runs-on: ubuntu-latest
    needs: [p2e-direct]
    timeout-minutes: 25
    env:
      TEST_VENDOR_MONGO_URI: mongodb://localhost:27017/?replicaSet=wilsyVendorCertRS
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install pytest==9.1.1 pymongo==4.18.2 pydantic==2.11.7
      - name: Compile real-Mongo certificate
        run: |
          python -m py_compile \
            tools/eos/legal_operations/orchestration/legal_client_acceptance_orchestrator.py \
            tests/integration/test_legal_client_acceptance_orchestrator_real_mongo.py
      - name: Start disposable Mongo replica set
        run: |
          docker run --detach --name wilsy-l9a4-p2e-cert-mongo \
            --publish 27017:27017 mongo:7.0.37 mongod \
            --replSet wilsyVendorCertRS --bind_ip_all
      - name: Initialize Mongo replica set
        run: |
          python - <<'PY'
          import time
          from pymongo import MongoClient
          client = MongoClient("mongodb://localhost:27017", directConnection=True, serverSelectionTimeoutMS=2_000)
          deadline = time.monotonic() + 60
          initiated = False
          last_error = None
          while True:
              try:
                  hello = client.admin.command("hello")
                  if not initiated and not hello.get("setName"):
                      client.admin.command({"replSetInitiate": {"_id": "wilsyVendorCertRS", "members": [{"_id": 0, "host": "localhost:27017"}]}})
                      initiated = True
                  hello = client.admin.command("hello")
                  if hello.get("setName") == "wilsyVendorCertRS" and hello.get("isWritablePrimary") is True and hello.get("logicalSessionTimeoutMinutes") is not None:
                      break
              except Exception as error:
                  last_error = error
              if time.monotonic() >= deadline:
                  raise RuntimeError(f"L9A4_P2E_CI_MONGO_UNAVAILABLE: {last_error!r}") from last_error
              time.sleep(1)
          client.close()
          PY
      - name: Run real-Mongo certificate without skips
        shell: bash
        run: |
          set -uo pipefail
          set +e
          output="$(python -m pytest -q -rs tests/integration/test_legal_client_acceptance_orchestrator_real_mongo.py 2>&1)"
          pytest_status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$pytest_status" -ne 0 ]; then exit "$pytest_status"; fi
          printf '%s\n' "$output" | grep -Eq '(^|[ =])[0-9]+ passed([, =]|$)'
          if printf '%s\n' "$output" | grep -qi 'skipped'; then
            echo "L9A4-P2E real-Mongo certification invalid: skipped tests detected"
            exit 1
          fi
      - name: Stop disposable Mongo
        if: always()
        run: docker rm -f wilsy-l9a4-p2e-cert-mongo 2>/dev/null || true
