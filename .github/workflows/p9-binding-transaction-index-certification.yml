name: P9 Practitioner Binding Index and Transaction Certification

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/p9-binding-transaction-index-certification.yml"
      - "tests/integration/test_legal_practitioner_binding_authenticated_eos_lifespan_real_mongo.py"
      - "tools/eos/api/legal_practitioner_matter_binding_router.py"
      - "tools/eos/legal_operations/registry/legal_practitioner_matter_binding_registry.py"
      - "tools/eos/legal_operations/service/legal_practitioner_matter_binding_provisioning_service.py"
  push:
    branches:
      - "cert/p9-binding-transaction-index-closure-20261026"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p9-binding-real-mongo:
    name: P9 disposable real-Mongo certification
    runs-on: macos-15
    timeout-minutes: 35
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install disposable MongoDB server
        run: |
          brew tap mongodb/brew
          brew trust mongodb/brew
          brew install mongodb-community@8.0
          sudo mkdir -p /opt/homebrew/bin
          sudo ln -sf "$(brew --prefix mongodb-community@8.0)/bin/mongod" /opt/homebrew/bin/mongod
          /opt/homebrew/bin/mongod --version

      - name: Install repository Python dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install -r requirements.txt
          python -m pip install pytest==9.1.1

      - name: Compile P9 authenticated EOS certificate
        run: |
          python -m py_compile tests/integration/test_legal_practitioner_binding_authenticated_eos_lifespan_real_mongo.py

      - name: Run P9 authenticated disposable real-Mongo certificate
        run: |
          python -m pytest -q -ra tests/integration/test_legal_practitioner_binding_authenticated_eos_lifespan_real_mongo.py
