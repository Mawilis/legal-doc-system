name: EOS Platform Dunning Projection Certification

on:
  push:
    branches:
      - eos/tenant-discovery-iam-dashboard-roadmap
  pull_request:
    branches:
      - eos/atomic-owner-genesis-integration
    paths:
      - "tools/eos/saas/billing/platform_dunning_*.py"
      - "tools/eos/api/billing_router.py"
      - "tests/unit/test_platform_dunning_*.py"
      - "tests/integration/test_platform_dunning_registry_real_mongo.py"
      - "tests/integration/test_billing_intelligence_http_real_mongo.py"
      - ".github/workflows/platform-dunning-certification.yml"

# Keep only the newest certification for this source branch; superseded pending runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform-dunning-certification:
    name: Platform dunning unit and real-replica-set certification
    runs-on: ubuntu-latest
    env:
      TEST_VENDOR_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=wilsyVendorCertRS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused certification dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            pymongo==4.18.2 pytest==9.1.1 fastapi==0.115.12 \
            httpx==0.28.1 python-dotenv==1.1.1 bcrypt==4.3.0 pyotp==2.9.0 \
            email-validator==2.2.0

      - name: Compile dunning contracts and certificates
        run: |
          python -m py_compile \
            tools/eos/saas/billing/platform_dunning_registry.py \
            tools/eos/saas/billing/platform_dunning_evaluator.py \
            tests/unit/test_platform_dunning_registry.py \
            tests/unit/test_platform_dunning_evaluator.py \
            tests/integration/test_platform_dunning_registry_real_mongo.py \
            tests/integration/test_billing_intelligence_http_real_mongo.py

      - name: Start disposable MongoDB replica set
        run: |
          docker run --detach --name wilsy-platform-dunning-mongo \
            --publish 27017:27017 mongo:7.0.37 \
            mongod --replSet wilsyVendorCertRS --bind_ip_all

      - name: Initialize replica set and await writable primary
        run: |
          python - <<'PY'
          import time
          from pymongo import MongoClient
          client = MongoClient(
              "mongodb://127.0.0.1:27017",
              directConnection=True,
              serverSelectionTimeoutMS=2000,
          )
          deadline = time.monotonic() + 60
          initiated = False
          last_error = None
          while True:
              try:
                  hello = client.admin.command("hello")
                  if not initiated and not hello.get("setName"):
                      client.admin.command({
                          "replSetInitiate": {
                              "_id": "wilsyVendorCertRS",
                              "members": [{"_id": 0, "host": "127.0.0.1:27017"}],
                          }
                      })
                      initiated = True
                  if client.admin.command("hello").get("isWritablePrimary"):
                      break
              except Exception as error:
                  last_error = error
              if time.monotonic() >= deadline:
                  raise RuntimeError(
                      f"PLATFORM_DUNNING_REPLICA_SET_UNAVAILABLE:{last_error!r}"
                  ) from last_error
              time.sleep(1)
          client.close()
          PY

      - name: Run deterministic unit certification
        run: |
          python -m pytest -q \
            tests/unit/test_platform_dunning_registry.py \
            tests/unit/test_platform_dunning_evaluator.py

      - name: Run real Mongo replica-set certification
        run: |
          python -m pytest -q \
            tests/integration/test_platform_dunning_registry_real_mongo.py \
            tests/integration/test_billing_intelligence_http_real_mongo.py

      - name: Stop disposable MongoDB
        if: always()
        run: docker rm -f wilsy-platform-dunning-mongo 2>/dev/null || true
