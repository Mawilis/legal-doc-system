# WILSY OS — R10E PASSWORD RECOVERY ENGINE CERTIFICATION
# VERSION: v1.0.4-R10E54-MONGO-FAILURE-EVIDENCE
# AUTHORITY: Wilsy OS Core Governance
# PURPOSE: Execute bounded Python/client recovery certificates for PR #107-class
#          changes without admitting legacy Node reset-token authority, while
#          preserving full real-Mongo failure output for forensic adjudication.
# FINANCIAL AUTHORITY: None; Kennel EOS remains exclusive.

name: R10E Password Recovery Certification

on:
  pull_request:
    branches:
      - fg108o4b-knowledge-operating-room
    paths:
      - "tools/eos/saas/auth/password_recovery*.py"
      - "tools/eos/api/auth_router.py"
      - "tests/unit/test_password_recovery*.py"
      - "tests/integration/test_password_recovery*.py"
      - "client/src/**"
      - "client/package.json"
      - "client/package-lock.json"
      - ".github/workflows/r10e-password-recovery-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r10e-password-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-recovery-certification:
    name: Python Recovery Authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R10E35_PASSWORD_RECOVERY_MONGO_URI: mongodb://127.0.0.1:27027/?replicaSet=wilsyVendorCertRS
      R10B4_PASSWORD_RECOVERY_MONGO_URI: mongodb://127.0.0.1:27027/?replicaSet=wilsyVendorCertRS
      R10D3_PASSWORD_RESET_MONGO_URI: mongodb://127.0.0.1:27027/?replicaSet=wilsyVendorCertRS
      TEST_VENDOR_MONGO_URI: mongodb://127.0.0.1:27027/?replicaSet=wilsyVendorCertRS
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Create bounded Python environment
        run: |
          python3 -m venv .r10e-venv
          .r10e-venv/bin/python -m pip install --upgrade pip==25.3
          .r10e-venv/bin/python -m pip install -r requirements.txt
          .r10e-venv/bin/python -m pip install pytest==9.1.1 pyotp==2.9.0

      - name: Start MongoDB 7 replica set
        run: |
          docker run --detach --name wilsy-r10e-cert-mongo --network host mongo:7.0.37 mongod --port 27027 --replSet wilsyVendorCertRS --bind_ip_all

      - name: Initialize writable replica-set primary
        run: |
          .r10e-venv/bin/python - <<'PY'
          import time
          from pymongo import MongoClient

          client = MongoClient(
              "mongodb://127.0.0.1:27027",
              directConnection=True,
              serverSelectionTimeoutMS=2_000,
          )
          deadline = time.monotonic() + 60
          initiated = False
          last_error = None

          while True:
              try:
                  hello = client.admin.command("hello")
                  if not initiated and not hello.get("setName"):
                      client.admin.command(
                          {
                              "replSetInitiate": {
                                  "_id": "wilsyVendorCertRS",
                                  "members": [{"_id": 0, "host": "127.0.0.1:27027"}],
                              }
                          }
                      )
                      initiated = True

                  hello = client.admin.command("hello")
                  if (
                      hello.get("setName") == "wilsyVendorCertRS"
                      and hello.get("isWritablePrimary") is True
                  ):
                      break
              except Exception as error:
                  last_error = error

              if time.monotonic() >= deadline:
                  raise RuntimeError(
                      f"R10E_MONGO_REPLICA_SET_UNAVAILABLE: {last_error!r}"
                  ) from last_error
              time.sleep(1)

          client.close()
          PY

      - name: Compile R10E Python recovery contracts
        run: |
          .r10e-venv/bin/python -m py_compile             tools/eos/saas/auth/password_recovery.py             tools/eos/saas/auth/password_recovery_registry.py             tools/eos/saas/auth/password_recovery_contact.py             tools/eos/saas/auth/password_recovery_contact_registry.py             tools/eos/saas/auth/password_recovery_request_service.py             tools/eos/saas/auth/password_recovery_rate_limit.py             tools/eos/saas/auth/password_recovery_email_delivery.py             tools/eos/saas/auth/password_recovery_contact_verification.py             tools/eos/saas/auth/password_recovery_contact_verification_registry.py             tools/eos/saas/auth/password_recovery_contact_verification_email_delivery.py             tools/eos/saas/auth/password_recovery_contact_verification_request_service.py             tools/eos/saas/auth/password_recovery_contact_verification_service.py             tools/eos/saas/auth/password_reset_service.py             tools/eos/api/auth_router.py             tests/unit/test_password_recovery_contact.py             tests/unit/test_password_recovery_contact_registry.py             tests/unit/test_password_recovery_request_service.py             tests/unit/test_password_recovery_rate_limit.py             tests/unit/test_password_recovery_email_delivery.py             tests/unit/test_password_recovery_contact_verification.py             tests/unit/test_password_recovery_contact_verification_registry.py             tests/unit/test_password_recovery_contact_verification_request_service.py             tests/unit/test_password_recovery_contact_verification_service.py             tests/unit/test_password_reset_service.py             tests/integration/test_password_recovery_engine_http.py             tests/integration/test_password_recovery_engine_real_mongo.py             tests/integration/test_password_reset_service_real_mongo.py

      - name: Pyright R10E Python recovery contracts
        run: |
          npx --yes pyright@1.1.413             --pythonpath .r10e-venv/bin/python             tools/eos/saas/auth/password_recovery.py             tools/eos/saas/auth/password_recovery_registry.py             tools/eos/saas/auth/password_recovery_contact.py             tools/eos/saas/auth/password_recovery_contact_registry.py             tools/eos/saas/auth/password_recovery_request_service.py             tools/eos/saas/auth/password_recovery_rate_limit.py             tools/eos/saas/auth/password_recovery_email_delivery.py             tools/eos/saas/auth/password_recovery_contact_verification.py             tools/eos/saas/auth/password_recovery_contact_verification_registry.py             tools/eos/saas/auth/password_recovery_contact_verification_email_delivery.py             tools/eos/saas/auth/password_recovery_contact_verification_request_service.py             tools/eos/saas/auth/password_recovery_contact_verification_service.py             tools/eos/api/auth_router.py             tests/unit/test_password_recovery_contact.py             tests/unit/test_password_recovery_contact_registry.py             tests/unit/test_password_recovery_request_service.py             tests/unit/test_password_recovery_rate_limit.py             tests/unit/test_password_recovery_email_delivery.py             tests/unit/test_password_recovery_contact_verification.py             tests/unit/test_password_recovery_contact_verification_registry.py             tests/unit/test_password_recovery_contact_verification_request_service.py             tests/unit/test_password_recovery_contact_verification_service.py             tests/integration/test_password_recovery_engine_http.py             tests/integration/test_password_recovery_engine_real_mongo.py

      - name: Run direct recovery certificates
        run: |
          .r10e-venv/bin/python -m pytest -q             tests/unit/test_password_recovery_contact.py             tests/unit/test_password_recovery_contact_registry.py             tests/unit/test_password_recovery_request_service.py             tests/unit/test_password_recovery_rate_limit.py             tests/unit/test_password_recovery_email_delivery.py             tests/unit/test_password_recovery_contact_verification.py             tests/unit/test_password_recovery_contact_verification_registry.py             tests/unit/test_password_recovery_contact_verification_request_service.py             tests/unit/test_password_recovery_contact_verification_service.py             tests/unit/test_password_reset_service.py

      - name: Run mounted ASGI recovery certificate
        run: |
          .r10e-venv/bin/python -m pytest -q             tests/integration/test_password_recovery_engine_http.py             tests/integration/test_password_reset_http.py

      - name: Run real-Mongo recovery certificates
        run: |
          set -o pipefail
          output_file="$(mktemp)"
          set +e
          .r10e-venv/bin/python -m pytest -q \
            tests/integration/test_password_recovery_engine_real_mongo.py \
            tests/integration/test_password_reset_service_real_mongo.py \
            2>&1 | tee "$output_file"
          pytest_status="${PIPESTATUS[0]}"
          set -e
          if [ "$pytest_status" -ne 0 ]; then
            echo "R10E real-Mongo certificate failed with pytest exit $pytest_status"
            exit "$pytest_status"
          fi
          if grep -qE 'skipped|xfailed|xpassed' "$output_file"; then
            echo "R10E certification invalid: non-executed test outcome detected"
            exit 1
          fi
          grep -Eq '[0-9]+ passed' "$output_file"
          rm -f "$output_file"

      - name: Stop MongoDB certification container
        if: always()
        run: docker rm -f wilsy-r10e-cert-mongo 2>/dev/null || true

  client-recovery-certification:
    name: Client Recovery Projection
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run frozen password-reset transport certificate
        working-directory: client
        run: |
          npm run test:run --             src/__tests__/services/passwordResetApi.test.js

      - name: Build recovery client
        working-directory: client
        run: npm run build

# SOVEREIGN ARTIFACT SEAL
# VERSION: v1.0.4-R10E54-MONGO-FAILURE-EVIDENCE
# FAIL-CLOSED POSTURE: compile/type/test/Mongo/client failure blocks certification
# END OF WILSY OS SOVEREIGN ARTIFACT
