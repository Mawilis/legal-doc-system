# WILSY OS — R10E70 Python EOS Recovery Delivery Certification
# TITLE: R10E70 Python EOS Recovery Delivery Certification
# VERSION: v1.1.0-PYTHON-EOS-RECOVERY-CERTIFICATION
# AUTHORITY: Wilsy OS Core Governance
# EPITOME: Runs bounded Python compile, Pyright and deterministic recovery
#          origin/email certificates without creating legacy Node environment files.
# ABSOLUTE CANONICAL PATH: /Users/wilsonkhanyezi/legal-doc-system/.github/workflows/r10e70-production-recovery-delivery-certification.yml
# COLLABORATION / OWNERSHIP: Python EOS auth, recovery delivery and CI owners.
# CERTIFICATION / UPDATE DATE: 2026-11-10
# CHANGELOG: v1.1.0-PYTHON-EOS-RECOVERY-CERTIFICATION removes the retired server environment validator and synthetic server/.env.production fixture; Python EOS tests remain the configuration authority.
# COMPLIANCE: POPIA section 19; GDPR Article 32; SOC 2 CC7.2; ISO 27001.
# SECURITY / PRIVACY POSTURE: Synthetic test-only email values; no network or production secret access.
# TENANT BOUNDARY: Configuration tests create no tenant authority.
# AUTHORITY BOUNDARY: CI evidence only; no recovery, identity, delivery or runtime authority.
# FINANCIAL AUTHORITY BOUNDARY: None; Kennel EOS remains exclusive.
# FAIL-CLOSED POSTURE: Compile, type, or deterministic certificate failure blocks CI.

name: R10E70 Python EOS Recovery Delivery Certification

on:
  pull_request:
    branches:
      - fg108o4b-knowledge-operating-room
    paths:
      - "tools/eos/saas/auth/password_recovery_email_delivery.py"
      - "tools/eos/saas/auth/password_recovery_request_service.py"
      - "tools/eos/api/auth_router.py"
      - "tests/unit/test_password_recovery_email_delivery.py"
      - "tests/unit/test_password_recovery_production_configuration.py"
      - ".github/workflows/r10e70-production-recovery-delivery-certification.yml"

permissions:
  contents: read

jobs:
  python-eos-recovery-certification:
    name: R10E70 Python EOS Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create bounded Python environment
        run: |
          python3 -m venv .r10e70-venv
          .r10e70-venv/bin/python -m pip install --upgrade pip==25.3
          .r10e70-venv/bin/python -m pip install -r requirements.txt
          .r10e70-venv/bin/python -m pip install pytest==9.1.1 pyotp==2.9.0

      - name: Compile Python recovery and direct certificates
        run: |
          .r10e70-venv/bin/python -m py_compile \
            tools/eos/saas/auth/password_recovery_email_delivery.py \
            tools/eos/saas/auth/password_recovery_request_service.py \
            tools/eos/api/auth_router.py \
            tests/unit/test_password_recovery_email_delivery.py \
            tests/unit/test_password_recovery_production_configuration.py

      - name: Pyright Python recovery contracts
        run: |
          npx --yes pyright@1.1.413 \
            --pythonpath .r10e70-venv/bin/python \
            tools/eos/saas/auth/password_recovery_email_delivery.py \
            tools/eos/saas/auth/password_recovery_request_service.py \
            tools/eos/api/auth_router.py

      - name: Run deterministic recovery configuration certificates
        run: |
          .r10e70-venv/bin/python -m pytest -q \
            tests/unit/test_password_recovery_email_delivery.py \
            tests/unit/test_password_recovery_production_configuration.py

# ARTIFACT: r10e70-production-recovery-delivery-certification.yml
