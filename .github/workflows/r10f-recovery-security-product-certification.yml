name: R10F Recovery Security Product Certification

on:
  pull_request:
    branches:
      - fg108o4b-knowledge-operating-room
    paths:
      - "client/src/components/account/WilsyAccountCommandCenter.jsx"
      - "client/src/components/account/RecoveryContactSecurityControl.jsx"
      - "client/src/__tests__/components/recoveryContactSecurityWiring.test.jsx"
      - "client/src/services/api.js"
      - "client/package.json"
      - "client/package-lock.json"
      - ".github/workflows/r10f-recovery-security-product-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r10f-recovery-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  recovery-security-product:
    name: Recovery Security Product
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Run recovery-security wiring certificate
        working-directory: client
        run: |
          npm run test:run -- \
            src/__tests__/components/recoveryContactSecurityWiring.test.jsx

      - name: Run frozen password-reset transport certificate
        working-directory: client
        run: |
          npm run test:run -- \
            src/__tests__/services/passwordResetApi.test.js

      - name: Build recovery-enabled client
        working-directory: client
        run: npm run build

