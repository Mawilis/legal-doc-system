# WILSY OS — R10G PASSWORD RESET NOTIFICATION CERTIFICATION
# TITLE: R10G Password Reset Notification Certification
# VERSION: v1.0.0-R10G11-STATIC-DIRECT-CERTIFICATION
# AUTHORITY: Wilsy OS Core Governance
# EPITOME: Executes bounded compile, Pyright, and deterministic direct
#          certificates for durable post-reset notification intent, registry,
#          dispatcher, encrypted email adapter, and atomic reset integration.
# ABSOLUTE CANONICAL PATH: /Users/wilsonkhanyezi/legal-doc-system/.github/workflows/r10g-password-reset-notification-certification.yml
# COLLABORATION / OWNERSHIP: R10G auth production/test artifacts only; R10E
#                            recovery certification remains separately frozen.
# CERTIFICATION / UPDATE DATE: 2026-09-22
# CHANGELOG: v1.0.0-R10G11-STATIC-DIRECT-CERTIFICATION — Adds pull-request
#            execution for compile, Pyright, R10G1–R10G10 direct certificates,
#            and the reconciled password-reset service certificate.
# COMPLIANCE: POPIA section 19; GDPR Article 32; SOC 2 CC7.2; ISO 27001.
# SECURITY / PRIVACY POSTURE: CI uses repository synthetic certificates only.
# TENANT BOUNDARY: No production tenant or data source is accessed.
# AUTHORITY BOUNDARY: Certification evidence only; no runtime authority.
# FINANCIAL AUTHORITY BOUNDARY: None; Kennel EOS remains exclusive.
# FAIL-CLOSED POSTURE: Compile, type, or direct certificate failure fails CI.

name: R10G Password Reset Notification Certification

on:
  pull_request:
    branches:
      - fg108o4b-knowledge-operating-room
    paths:
      - "tools/eos/saas/auth/password_reset_notification.py"
      - "tools/eos/saas/auth/password_reset_notification_registry.py"
      - "tools/eos/saas/auth/password_reset_notification_dispatcher.py"
      - "tools/eos/saas/auth/password_reset_notification_email_delivery.py"
      - "tools/eos/saas/auth/password_reset_service.py"
      - "tests/unit/test_password_reset_notification.py"
      - "tests/unit/test_password_reset_notification_registry.py"
      - "tests/unit/test_password_reset_notification_dispatcher.py"
      - "tests/unit/test_password_reset_notification_email_delivery.py"
      - "tests/unit/test_password_reset_service.py"
      - ".github/workflows/r10g-password-reset-notification-certification.yml"

permissions:
  contents: read

jobs:
  static-direct-certification:
    name: R10G Static and Direct Authority
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Create bounded Python environment
        run: |
          python3 -m venv .r10g-venv
          .r10g-venv/bin/python -m pip install --upgrade pip==25.3
          .r10g-venv/bin/python -m pip install -r requirements.txt
          .r10g-venv/bin/python -m pip install pytest==9.1.1 pyotp==2.9.0

      - name: Compile R10G production and certificates
        run: |
          .r10g-venv/bin/python -m py_compile \
            tools/eos/saas/auth/password_reset_notification.py \
            tools/eos/saas/auth/password_reset_notification_registry.py \
            tools/eos/saas/auth/password_reset_notification_dispatcher.py \
            tools/eos/saas/auth/password_reset_notification_email_delivery.py \
            tools/eos/saas/auth/password_reset_service.py \
            tests/unit/test_password_reset_notification.py \
            tests/unit/test_password_reset_notification_registry.py \
            tests/unit/test_password_reset_notification_dispatcher.py \
            tests/unit/test_password_reset_notification_email_delivery.py \
            tests/unit/test_password_reset_service.py

      - name: Pyright R10G production contracts
        run: |
          npx --yes pyright@1.1.413 \
            --pythonpath .r10g-venv/bin/python \
            tools/eos/saas/auth/password_reset_notification.py \
            tools/eos/saas/auth/password_reset_notification_registry.py \
            tools/eos/saas/auth/password_reset_notification_dispatcher.py \
            tools/eos/saas/auth/password_reset_notification_email_delivery.py \
            tools/eos/saas/auth/password_reset_service.py

      - name: Run R10G deterministic direct certificates
        run: |
          .r10g-venv/bin/python -m pytest -q \
            tests/unit/test_password_reset_notification.py \
            tests/unit/test_password_reset_notification_registry.py \
            tests/unit/test_password_reset_notification_dispatcher.py \
            tests/unit/test_password_reset_notification_email_delivery.py \
            tests/unit/test_password_reset_service.py

