name: WILSY Repository Integrity

on:
  push:
  pull_request:
  workflow_dispatch:

# Keep only the newest certification for this source branch; superseded pending runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-integrity:
    name: Repository Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce repository integrity
        run: |
          python tools/eos/governance/repository_integrity_guard.py \
            --commit "$GITHUB_SHA"

      - name: Enforce public status consistency
        run: |
          python tools/eos/governance/public_status.py --check

