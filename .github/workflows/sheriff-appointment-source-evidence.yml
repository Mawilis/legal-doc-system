name: Sheriff Appointment Evidence Certification

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/eos/legal_operations/domain/sheriff_appointment_source_evidence.py"
      - "tools/eos/legal_operations/domain/sheriff_ministerial_appointment_verification.py"
      - "tools/eos/legal_operations/domain/sheriff_area_allocation_evidence.py"
      - "tools/eos/legal_operations/domain/sheriff_board_decision_evidence.py"
      - "tools/eos/legal_operations/domain/sheriff_fidelity_fund_certificate_evidence.py"
      - "tools/eos/legal_operations/domain/sheriff_professional_indemnity_insurance_evidence.py"
      - "tools/eos/legal_operations/domain/sheriff_natural_person_principal_binding.py"
      - "tests/unit/test_sheriff_appointment_source_evidence.py"
      - "tests/unit/test_sheriff_ministerial_appointment_verification.py"
      - "tests/unit/test_sheriff_area_allocation_evidence.py"
      - "tests/unit/test_sheriff_board_decision_evidence.py"
      - "tests/unit/test_sheriff_fidelity_fund_certificate_evidence.py"
      - "tests/unit/test_sheriff_professional_indemnity_insurance_evidence.py"
      - "tests/unit/test_sheriff_natural_person_principal_binding.py"
      - "tools/eos/legal_operations/registry/sheriff_appointment_source_evidence_registry.py"
      - "tests/unit/test_sheriff_appointment_source_evidence_registry.py"
      - "tests/integration/test_sheriff_appointment_source_evidence_registry_real_mongo.py"
      - ".github/workflows/sheriff-appointment-source-evidence.yml"
  push:
    branches:
      - main
      - feat/sheriff-appointment-source-evidence-20261102
      - feat/sheriff-appointment-evidence-registry-20261102
      - ci/sheriff-registry-real-mongo-cert-20261102
    paths:
      - "tools/eos/legal_operations/domain/sheriff_appointment_source_evidence.py"
      - "tools/eos/legal_operations/domain/sheriff_ministerial_appointment_verification.py"
      - "tools/eos/legal_operations/domain/sheriff_area_allocation_evidence.py"
      - "tools/eos/legal_operations/domain/sheriff_board_decision_evidence.py"
      - "tools/eos/legal_operations/domain/sheriff_fidelity_fund_certificate_evidence.py"
      - "tools/eos/legal_operations/domain/sheriff_professional_indemnity_insurance_evidence.py"
      - "tools/eos/legal_operations/domain/sheriff_natural_person_principal_binding.py"
      - "tests/unit/test_sheriff_appointment_source_evidence.py"
      - "tests/unit/test_sheriff_ministerial_appointment_verification.py"
      - "tests/unit/test_sheriff_area_allocation_evidence.py"
      - "tests/unit/test_sheriff_board_decision_evidence.py"
      - "tests/unit/test_sheriff_fidelity_fund_certificate_evidence.py"
      - "tests/unit/test_sheriff_professional_indemnity_insurance_evidence.py"
      - "tests/unit/test_sheriff_natural_person_principal_binding.py"
      - "tools/eos/legal_operations/registry/sheriff_appointment_source_evidence_registry.py"
      - "tests/unit/test_sheriff_appointment_source_evidence_registry.py"
      - "tests/integration/test_sheriff_appointment_source_evidence_registry_real_mongo.py"
      - ".github/workflows/sheriff-appointment-source-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sheriff-appointment-domain:
    name: Sheriff appointment source evidence — direct, static and real Mongo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_VENDOR_MONGO_URI: mongodb://127.0.0.1:27017/?replicaSet=wilsyVendorCertRS
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node for pinned Pyright
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install bounded test dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install pytest==9.1.1 pymongo==4.18.2

      - name: Start isolated Sheriff evidence Mongo replica set
        if: ${{ hashFiles('tests/integration/test_sheriff_appointment_source_evidence_registry_real_mongo.py') != '' }}
        run: |
          docker run --detach --name wilsy-sheriff-evidence-cert-mongo \
            --publish 27017:27017 mongo:7.0.37 \
            mongod --replSet wilsyVendorCertRS --bind_ip_all

      - name: Initialize isolated Sheriff evidence Mongo replica set
        if: ${{ hashFiles('tests/integration/test_sheriff_appointment_source_evidence_registry_real_mongo.py') != '' }}
        run: |
          python - <<'PY'
          import time
          from pymongo import MongoClient

          client = MongoClient(
              "mongodb://127.0.0.1:27017",
              directConnection=True,
              serverSelectionTimeoutMS=2000,
          )
          deadline = time.monotonic() + 60
          initiated = False
          last_error = None
          while True:
              try:
                  hello = client.admin.command("hello")
                  if not initiated and not hello.get("setName"):
                      client.admin.command({
                          "replSetInitiate": {
                              "_id": "wilsyVendorCertRS",
                              "members": [{"_id": 0, "host": "127.0.0.1:27017"}],
                          }
                      })
                      initiated = True
                  if client.admin.command("hello").get("isWritablePrimary"):
                      break
              except Exception as error:
                  last_error = error
              if time.monotonic() >= deadline:
                  raise RuntimeError(
                      f"SHERIFF_EVIDENCE_MONGO_REPLICA_SET_UNAVAILABLE: {last_error!r}"
                  ) from last_error
              time.sleep(1)
          client.close()
          PY

      - name: Compile present Sheriff evidence sources and certificates
        shell: bash
        run: |
          set -euo pipefail
          files=(
            tools/eos/legal_operations/domain/sheriff_appointment_source_evidence.py
            tests/unit/test_sheriff_appointment_source_evidence.py
            tests/unit/test_sheriff_ministerial_appointment_verification.py
            tests/unit/test_sheriff_area_allocation_evidence.py
            tests/unit/test_sheriff_board_decision_evidence.py
            tests/unit/test_sheriff_fidelity_fund_certificate_evidence.py
            tests/unit/test_sheriff_professional_indemnity_insurance_evidence.py
            tests/unit/test_sheriff_natural_person_principal_binding.py
          )
          if [[ -f tools/eos/legal_operations/domain/sheriff_ministerial_appointment_verification.py ]]; then
            files+=(tools/eos/legal_operations/domain/sheriff_ministerial_appointment_verification.py)
          fi
          if [[ -f tools/eos/legal_operations/domain/sheriff_area_allocation_evidence.py ]]; then
            files+=(tools/eos/legal_operations/domain/sheriff_area_allocation_evidence.py)
          fi
          if [[ -f tools/eos/legal_operations/domain/sheriff_board_decision_evidence.py ]]; then
            files+=(tools/eos/legal_operations/domain/sheriff_board_decision_evidence.py)
          fi
          if [[ -f tools/eos/legal_operations/domain/sheriff_fidelity_fund_certificate_evidence.py ]]; then
            files+=(tools/eos/legal_operations/domain/sheriff_fidelity_fund_certificate_evidence.py)
          fi
          if [[ -f tools/eos/legal_operations/domain/sheriff_professional_indemnity_insurance_evidence.py ]]; then
            files+=(tools/eos/legal_operations/domain/sheriff_professional_indemnity_insurance_evidence.py)
          fi
          if [[ -f tools/eos/legal_operations/domain/sheriff_natural_person_principal_binding.py ]]; then
            files+=(tools/eos/legal_operations/domain/sheriff_natural_person_principal_binding.py)
          fi
          if [[ -f tools/eos/legal_operations/registry/sheriff_appointment_source_evidence_registry.py ]]; then
            files+=(
              tools/eos/legal_operations/registry/sheriff_appointment_source_evidence_registry.py
              tests/unit/test_sheriff_appointment_source_evidence_registry.py
            )
          fi
          if [[ -f tests/integration/test_sheriff_appointment_source_evidence_registry_real_mongo.py ]]; then
            files+=(tests/integration/test_sheriff_appointment_source_evidence_registry_real_mongo.py)
          fi
          python -m py_compile "${files[@]}"

      - name: Type-check present Sheriff evidence sources and certificates
        shell: bash
        run: |
          set -euo pipefail
          files=(
            tools/eos/legal_operations/domain/sheriff_appointment_source_evidence.py
            tests/unit/test_sheriff_appointment_source_evidence.py
            tests/unit/test_sheriff_ministerial_appointment_verification.py
            tests/unit/test_sheriff_area_allocation_evidence.py
            tests/unit/test_sheriff_board_decision_evidence.py
            tests/unit/test_sheriff_fidelity_fund_certificate_evidence.py
            tests/unit/test_sheriff_professional_indemnity_insurance_evidence.py
            tests/unit/test_sheriff_natural_person_principal_binding.py
          )
          if [[ -f tools/eos/legal_operations/domain/sheriff_ministerial_appointment_verification.py ]]; then
            files+=(tools/eos/legal_operations/domain/sheriff_ministerial_appointment_verification.py)
          fi
          if [[ -f tools/eos/legal_operations/domain/sheriff_area_allocation_evidence.py ]]; then
            files+=(tools/eos/legal_operations/domain/sheriff_area_allocation_evidence.py)
          fi
          if [[ -f tools/eos/legal_operations/domain/sheriff_board_decision_evidence.py ]]; then
            files+=(tools/eos/legal_operations/domain/sheriff_board_decision_evidence.py)
          fi
          if [[ -f tools/eos/legal_operations/domain/sheriff_fidelity_fund_certificate_evidence.py ]]; then
            files+=(tools/eos/legal_operations/domain/sheriff_fidelity_fund_certificate_evidence.py)
          fi
          if [[ -f tools/eos/legal_operations/domain/sheriff_professional_indemnity_insurance_evidence.py ]]; then
            files+=(tools/eos/legal_operations/domain/sheriff_professional_indemnity_insurance_evidence.py)
          fi
          if [[ -f tools/eos/legal_operations/domain/sheriff_natural_person_principal_binding.py ]]; then
            files+=(tools/eos/legal_operations/domain/sheriff_natural_person_principal_binding.py)
          fi
          if [[ -f tools/eos/legal_operations/registry/sheriff_appointment_source_evidence_registry.py ]]; then
            files+=(
              tools/eos/legal_operations/registry/sheriff_appointment_source_evidence_registry.py
              tests/unit/test_sheriff_appointment_source_evidence_registry.py
            )
          fi
          if [[ -f tests/integration/test_sheriff_appointment_source_evidence_registry_real_mongo.py ]]; then
            files+=(tests/integration/test_sheriff_appointment_source_evidence_registry_real_mongo.py)
          fi
          npx --yes pyright@1.1.413 --pythonpath "$(command -v python)" "${files[@]}"

      - name: Run present Sheriff evidence certificates with no skips
        shell: bash
        run: |
          set -uo pipefail
          tests=(tests/unit/test_sheriff_appointment_source_evidence.py)
          if [[ -f tests/unit/test_sheriff_ministerial_appointment_verification.py ]]; then
            tests+=(tests/unit/test_sheriff_ministerial_appointment_verification.py)
          fi
          if [[ -f tests/unit/test_sheriff_area_allocation_evidence.py ]]; then
            tests+=(tests/unit/test_sheriff_area_allocation_evidence.py)
          fi
          if [[ -f tests/unit/test_sheriff_board_decision_evidence.py ]]; then
            tests+=(tests/unit/test_sheriff_board_decision_evidence.py)
          fi
          if [[ -f tests/unit/test_sheriff_fidelity_fund_certificate_evidence.py ]]; then
            tests+=(tests/unit/test_sheriff_fidelity_fund_certificate_evidence.py)
          fi
          if [[ -f tests/unit/test_sheriff_professional_indemnity_insurance_evidence.py ]]; then
            tests+=(tests/unit/test_sheriff_professional_indemnity_insurance_evidence.py)
          fi
          if [[ -f tests/unit/test_sheriff_natural_person_principal_binding.py ]]; then
            tests+=(tests/unit/test_sheriff_natural_person_principal_binding.py)
          fi
          if [[ -f tests/unit/test_sheriff_appointment_source_evidence_registry.py ]]; then
            tests+=(tests/unit/test_sheriff_appointment_source_evidence_registry.py)
          fi
          if [[ -f tests/integration/test_sheriff_appointment_source_evidence_registry_real_mongo.py ]]; then
            tests+=(tests/integration/test_sheriff_appointment_source_evidence_registry_real_mongo.py)
          fi
          set +e
          output="$(python -m pytest -q -rs "${tests[@]}" 2>&1)"
          pytest_status=$?
          set -e
          printf '%s\\n' "$output"
          if [ "$pytest_status" -ne 0 ]; then
            exit "$pytest_status"
          fi
          printf '%s\\n' "$output" | grep -Eq '[0-9]+ passed'
          if printf '%s\\n' "$output" | grep -qi 'skipped'; then
            echo "Sheriff appointment evidence certification invalid: skipped tests detected"
            exit 1
          fi

      - name: Stop isolated Sheriff evidence Mongo replica set
        if: always() && hashFiles('tests/integration/test_sheriff_appointment_source_evidence_registry_real_mongo.py') != ''
        run: docker rm -f wilsy-sheriff-evidence-cert-mongo 2>/dev/null || true

      - name: Verify patch whitespace
        run: git diff --check origin/main...HEAD
