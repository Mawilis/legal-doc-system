name: Sheriff office appointment evidence certification

on:
  push:
    branches:
      - feat/sheriff-office-scoped-operations-20261102
  pull_request:
    paths:
      - "tools/eos/legal_operations/domain/sheriff_office_appointment_authority.py"
      - "tests/unit/test_sheriff_office_appointment_authority.py"
      - "tools/eos/legal_operations/registry/sheriff_office_appointment_authority_registry.py"
      - "tests/unit/test_sheriff_office_appointment_authority_registry.py"
      - "tests/integration/test_sheriff_office_appointment_authority_registry_real_mongo.py"
      - "tools/eos/legal_operations/orchestration/sheriff_office_appointment_authority_orchestrator.py"
      - "tests/unit/test_sheriff_office_appointment_authority_orchestrator.py"
      - ".github/workflows/sheriff-office-appointment-evidence-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sheriff-office-appointment-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sheriff-office-appointment-evidence:
    name: Sheriff appointment evidence domain certification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      WILSY_SHERIFF_APPOINTMENT_REAL_MONGO_URI: mongodb://localhost:27017/?replicaSet=wilsySheriffAppointmentRS
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Node for pinned Pyright
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install repository and test dependencies
        run: |
          python -m pip install --upgrade pip==25.3
          python -m pip install -r requirements.txt pytest==9.1.1

      - name: Start isolated MongoDB replica set
        run: |
          docker run --detach --name wilsy-sheriff-appointment-mongo \
            --publish 27017:27017 mongo:7.0.37 \
            mongod --replSet wilsySheriffAppointmentRS --bind_ip_all

      - name: Initialize MongoDB replica set
        run: |
          python - <<'PY'
          import time
          from pymongo import MongoClient

          client = MongoClient(
              "mongodb://localhost:27017",
              directConnection=True,
              serverSelectionTimeoutMS=2_000,
          )
          deadline = time.monotonic() + 60
          initiated = False
          last_error = None
          while True:
              try:
                  hello = client.admin.command("hello")
                  if not initiated and not hello.get("setName"):
                      client.admin.command({
                          "replSetInitiate": {
                              "_id": "wilsySheriffAppointmentRS",
                              "members": [{"_id": 0, "host": "localhost:27017"}],
                          }
                      })
                      initiated = True
                  if client.admin.command("hello").get("isWritablePrimary"):
                      break
              except Exception as error:
                  last_error = error
              if time.monotonic() >= deadline:
                  raise RuntimeError(
                      f"SHERIFF_APPOINTMENT_MONGO_REPLICA_SET_UNAVAILABLE: {last_error!r}"
                  ) from last_error
              time.sleep(1)
          client.close()
          PY

      - name: Compile appointment evidence domain and certificate
        run: |
          python -m py_compile \
            tools/eos/legal_operations/domain/sheriff_office_appointment_authority.py \
            tests/unit/test_sheriff_office_appointment_authority.py \
            tools/eos/legal_operations/registry/sheriff_office_appointment_authority_registry.py \
            tests/unit/test_sheriff_office_appointment_authority_registry.py \
            tests/integration/test_sheriff_office_appointment_authority_registry_real_mongo.py \
            tools/eos/legal_operations/orchestration/sheriff_office_appointment_authority_orchestrator.py \
            tests/unit/test_sheriff_office_appointment_authority_orchestrator.py \
            tests/integration/test_sheriff_office_appointment_authority_registry_real_mongo.py

      - name: Type-check appointment evidence domain and certificate
        run: |
          npx --yes pyright@1.1.413 \
            --pythonpath "$(python -c 'import sys; print(sys.executable)')" \
            tools/eos/legal_operations/domain/sheriff_office_appointment_authority.py \
            tests/unit/test_sheriff_office_appointment_authority.py \
            tools/eos/legal_operations/registry/sheriff_office_appointment_authority_registry.py \
            tests/unit/test_sheriff_office_appointment_authority_registry.py \
            tests/integration/test_sheriff_office_appointment_authority_registry_real_mongo.py \
            tools/eos/legal_operations/orchestration/sheriff_office_appointment_authority_orchestrator.py \
            tests/unit/test_sheriff_office_appointment_authority_orchestrator.py

      - name: Run appointment evidence unit and real-Mongo certificates
        run: |
          python -m pytest -q \
            tests/unit/test_sheriff_office_appointment_authority.py \
            tests/unit/test_sheriff_office_appointment_authority_registry.py \
            tests/integration/test_sheriff_office_appointment_authority_registry_real_mongo.py \
            tests/unit/test_sheriff_office_appointment_authority_orchestrator.py

      - name: Stop isolated MongoDB replica set
        if: always()
        run: docker rm -f wilsy-sheriff-appointment-mongo 2>/dev/null || true
