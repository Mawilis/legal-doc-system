name: Python Telemetry Ingestion Certification

on:
  pull_request:
    paths:
      - "tools/eos/api/telemetry_ingestion_router.py"
      - "tools/eos/api/server.py"
      - "tools/eos/auth/permission_namespace.py"
      - "tools/eos/auth/roles.py"
      - "tools/eos/auth/tenant_authorization.py"
      - "tools/eos/auth/tenant_authority_policy.py"
      - "tests/unit/test_telemetry_ingestion_router.py"
      - ".github/workflows/telemetry-ingestion-certification.yml"
  push:
    branches:
      - "feat/python-telemetry-ingestion-20261028"
    paths:
      - "tools/eos/api/telemetry_ingestion_router.py"
      - "tools/eos/api/server.py"
      - "tools/eos/auth/permission_namespace.py"
      - "tools/eos/auth/roles.py"
      - "tools/eos/auth/tenant_authorization.py"
      - "tools/eos/auth/tenant_authority_policy.py"
      - "tests/unit/test_telemetry_ingestion_router.py"
      - ".github/workflows/telemetry-ingestion-certification.yml"

permissions:
  contents: read

jobs:
  telemetry-ingestion-unit:
    name: Telemetry ingestion unit and syntax certification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install governed Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest==9.1.1
      - name: Compile changed Python artifacts
        run: |
          python -m py_compile \
            tools/eos/api/telemetry_ingestion_router.py \
            tools/eos/api/server.py \
            tools/eos/auth/permission_namespace.py \
            tools/eos/auth/roles.py \
            tools/eos/auth/tenant_authorization.py \
            tools/eos/auth/tenant_authority_policy.py \
            tests/unit/test_telemetry_ingestion_router.py
      - name: Run telemetry ingestion regression suite
        run: python -m pytest -q tests/unit/test_telemetry_ingestion_router.py
