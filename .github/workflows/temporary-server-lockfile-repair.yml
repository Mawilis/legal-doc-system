name: Temporary server lockfile repair
on:
  push:
    branches:
      - fix/241-dependency-audit-closure
    paths:
      - '.github/workflows/temporary-server-lockfile-repair.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/241-dependency-audit-closure
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Regenerate lockfile from the exact manifest
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit
      - name: Verify clean installation and production audit
        run: |
          npm ci --legacy-peer-deps
          npm audit --omit=dev --audit-level=high
      - name: Commit regenerated lockfile
        working-directory: .
        run: |
          if git diff --quiet -- server/package-lock.json; then
            echo 'Lockfile unchanged; no repair commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/package-lock.json
          git commit -m 'fix(security): regenerate server dependency lockfile'
          git push origin HEAD:fix/241-dependency-audit-closure
