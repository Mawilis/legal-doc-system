# ============================================================================
# WILSY OS 2050 - GITLAB CI/CD PIPELINE
# Now with Frontend Sovereign Tests (BusinessContext & Cross‑Dashboard)
# ============================================================================

stages:
  - security
  - test
  - vendor_certification
  - frontend
  - integration
  - coverage
  - badges
  - deploy

variables:
  NODE_VERSION: "20"
  NODE_ENV: "test"
  FORENSIC_HMAC_KEY: "test-key-for-signature-verification"
  JWT_SECRET: "test-jwt-secret"
  JWT_REFRESH_SECRET: "test-refresh-secret"
  ADMIN_EMAIL: "wilsonkhanyezi@gmail.com"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD:-REDACTED}"
  TEST_MONGODB_URI: ${TEST_MONGODB_URI}
  NODE_OPTIONS: "--experimental-vm-modules"

cache:
  paths:
    - server/node_modules/
    - client/node_modules/   # added for frontend

# ============================================================================
# VENDOR CERTIFICATION — merge-critical real MongoDB replica-set gate
# ============================================================================
vendor-registry-certification:
  stage: vendor_certification
  image: node:20-bookworm
  services:
    - name: mongo:7.0.37
      alias: mongo
      command: ["mongod", "--replSet", "wilsyVendorCertRS", "--bind_ip_all"]
  variables:
    TEST_VENDOR_MONGO_URI: "mongodb://mongo:27017/?replicaSet=wilsyVendorCertRS"
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 python3-venv
    - python3 -m venv .ci-venv
    - .ci-venv/bin/python -m pip install --upgrade pip==25.3
    - .ci-venv/bin/python -m pip install pymongo==4.16.0 pytest==9.1.1
    - npm ci
  script:
    - |
      .ci-venv/bin/python - <<'PY'
      import os
      import time
      from pymongo import MongoClient

      client = MongoClient("mongodb://mongo:27017", serverSelectionTimeoutMS=2_000)
      deadline = time.monotonic() + 60
      while True:
          try:
              hello = client.admin.command("hello")
              if not hello.get("setName"):
                  try:
                      client.admin.command({"replSetInitiate": {"_id": "wilsyVendorCertRS", "members": [{"_id": 0, "host": "mongo:27017"}]}})
                  except Exception:
                      pass
              if client.admin.command("hello").get("isWritablePrimary"):
                  break
          except Exception:
              pass
          if time.monotonic() >= deadline:
              raise RuntimeError("CI_VENDOR_MONGO_REPLICA_SET_UNAVAILABLE")
          time.sleep(1)
      client.close()
      PY
    - .ci-venv/bin/python -m py_compile tools/eos/saas/billing/vendor_registry.py tools/eos/saas/domain/vendor.py tests/integration/test_vendor_registry_mongo.py
    - npx pyright tools/eos/saas/billing/vendor_registry.py tools/eos/saas/domain/vendor.py tests/integration/test_vendor_registry_mongo.py tests/helpers/vendor_restart_checkpoint.py
    - .ci-venv/bin/python -m pytest -q tests/integration/test_vendor_registry_mongo.py

