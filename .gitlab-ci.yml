  script:
    - |
      .ci-venv/bin/python - <<'PY'
      import time
      from pymongo import MongoClient

      client = MongoClient("mongodb://mongo:27017", serverSelectionTimeoutMS=2_000)
      deadline = time.monotonic() + 60
      while True:
          try:
              hello = client.admin.command("hello")
              if not hello.get("setName"):
                  try:
                      client.admin.command({"replSetInitiate": {"_id": "wilsyVendorCertRS", "members": [{"_id": 0, "host": "mongo:27017"}]}})
                  except Exception:
                      pass
              if client.admin.command("hello").get("isWritablePrimary"):
                  break
