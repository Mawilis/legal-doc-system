# TITLE: WILSY EOS Local-Development Global Principal MFA KMS Infrastructure
# VERSION: v1.0.4-LOCAL-GLOBAL-MFA-KMS-ALIAS-ADMINISTRATION
# AUTHORITY: Dedicated local-development AWS infrastructure only.
# EPITOME: Provision one isolated MFA KMS key, alias, and narrowly trusted local EOS role.
# ABSOLUTE CANONICAL PATH: /Users/wilsonkhanyezi/legal-doc-system/infra/aws/global-principal-mfa-kms-local-development.yaml
# COLLABORATION / OWNERSHIP: Wilsy Core Engineering.
# CERTIFICATION OR UPDATE DATE: 2026-11-09.
# CHANGELOG: v1.0.4 grants the explicitly designated key administrator kms:CreateAlias and kms:DeleteAlias on this key so CloudFormation can create and remove the dedicated alias; v1.0.3 grants kms:EnableKeyRotation for mandatory automatic rotation; v1.0.2 orders key creation after the local role and removes redundant role-side KMS grants; v1.0.1 binds key use to the exact role without account-wide delegation; v1.0.0 establishes the isolated local-development key and role.
# COMPLIANCE: CloudFormation definition only; deployment requires a reviewed change set and explicit operator execution.
# SECURITY / PRIVACY POSTURE: No static credentials, access keys, EKS resources, OIDC providers, or production workload identity.
# TENANT BOUNDARY: No tenant data, database, or tenant identity resources are created.
# AUTHORITY BOUNDARY: Local developer role may use only this key for GLOBAL_PRINCIPAL_TOTP; alias and key administration are separately assigned to the designated key administrator.
# FINANCIAL AUTHORITY BOUNDARY: No financial execution authority; Kennel EOS remains exclusive.

AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  WILSY EOS local-development Global Principal MFA KMS key and dedicated
  assumed role. This stack creates no production workload identity.

Parameters:
  LocalDeveloperPrincipalArn:
    Type: String
    Description: Exact IAM user ARN permitted to assume the local EOS MFA role.
    AllowedPattern: '^arn:[a-z0-9-]+:iam::[0-9]{12}:user/.+$'
  KeyAdministratorPrincipalArn:
    Type: String
    Description: Exact IAM user ARN permitted to administer this dedicated key.
    AllowedPattern: '^arn:[a-z0-9-]+:iam::[0-9]{12}:user/.+$'

Resources:
  LocalGlobalPrincipalMfaKey:
    Type: AWS::KMS::Key
    DependsOn: LocalGlobalPrincipalMfaRole
    Properties:
      Description: WILSY EOS local-development Global Principal TOTP envelope encryption
      Enabled: true
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      MultiRegion: false
      PendingWindowInDays: 30
      Tags:
        - Key: Application
          Value: WILSY-EOS
        - Key: Purpose
          Value: GLOBAL_PRINCIPAL_TOTP
        - Key: Environment
          Value: local-development
        - Key: DataClassification
          Value: AuthenticationSecret
        - Key: ManagedBy
          Value: CloudFormation
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: DedicatedLocalRoleMfaEnvelopeUse
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/wilsy-eos-global-mfa-local-development'
            Action:
              - kms:Encrypt
              - kms:Decrypt
            Resource: '*'
            Condition:
              StringEquals:
                kms:EncryptionContext:purpose: GLOBAL_PRINCIPAL_TOTP
          - Sid: DedicatedLocalKeyAdministration
            Effect: Allow
            Principal:
              AWS: !Ref KeyAdministratorPrincipalArn
            Action:
              - kms:CancelKeyDeletion
              - kms:CreateAlias
              - kms:DeleteAlias
              - kms:DescribeKey
              - kms:DisableKey
              - kms:EnableKey
              - kms:EnableKeyRotation
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListResourceTags
              - kms:PutKeyPolicy
              - kms:ScheduleKeyDeletion
              - kms:TagResource
              - kms:UntagResource
              - kms:UpdateKeyDescription
            Resource: '*'

  LocalGlobalPrincipalMfaKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/wilsy/local-development/global-principal-mfa
      TargetKeyId: !Ref LocalGlobalPrincipalMfaKey

  LocalGlobalPrincipalMfaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: wilsy-eos-global-mfa-local-development
      Description: Local Python EOS KMS use only; never a production workload role.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ExactLocalDeveloperAssumption
            Effect: Allow
            Principal:
              AWS: !Ref LocalDeveloperPrincipalArn
            Action: sts:AssumeRole

Outputs:
  LocalGlobalPrincipalMfaKeyArn:
    Description: Full ARN for WILSY_GLOBAL_MFA_KMS_KEY_ID in local development only.
    Value: !GetAtt LocalGlobalPrincipalMfaKey.Arn
  LocalGlobalPrincipalMfaKeyId:
    Value: !Ref LocalGlobalPrincipalMfaKey
  LocalGlobalPrincipalMfaKeyAlias:
    Value: !Ref LocalGlobalPrincipalMfaKeyAlias
  LocalGlobalPrincipalMfaRoleArn:
    Description: Configure the local AWS profile to assume this role.
    Value: !GetAtt LocalGlobalPrincipalMfaRole.Arn
