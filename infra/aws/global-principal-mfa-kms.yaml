# TITLE: WILSY EOS Production Global Principal MFA KMS Infrastructure
# VERSION: v1.0.0-PRODUCTION-EKS-GLOBAL-MFA-KMS
# AUTHORITY: Production KMS infrastructure definition for the verified EOS EKS workload only.
# EPITOME: Define the MFA envelope key and an EKS OIDC role restricted to the exact EOS ServiceAccount.
# ABSOLUTE CANONICAL PATH: /Users/wilsonkhanyezi/legal-doc-system/infra/aws/global-principal-mfa-kms.yaml
# COLLABORATION / OWNERSHIP: Wilsy Core Engineering.
# CERTIFICATION OR UPDATE DATE: 2026-11-08.
# CHANGELOG: v1.0.0 isolates production KMS trust to the supplied EKS OIDC provider and exact ServiceAccount; local-development identities and grants are excluded.
# COMPLIANCE: Infrastructure definition only; deployment is blocked until the actual hosting target and OIDC identity are verified.
# SECURITY / PRIVACY POSTURE: No static credentials or local-development principal; runtime KMS use is limited to Encrypt/Decrypt on this key with the MFA purpose context.
# TENANT BOUNDARY: No tenant, principal, session, or database records are created.
# AUTHORITY BOUNDARY: EKS workload identity only; key administration is assigned to a separate approved IAM role.
# FINANCIAL AUTHORITY BOUNDARY: No financial execution authority; Kennel EOS remains exclusive.

AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  WILSY Python EOS Global Principal MFA KMS key and dedicated EKS workload
  identity. Deploy only in af-south-1 after the EKS OIDC provider and namespace
  have been verified. No static AWS credentials are created.

Parameters:
  EosEksOidcProviderArn:
    Type: String
    Description: Exact IAM OIDC provider ARN registered for the approved EOS EKS cluster.
    AllowedPattern: '^arn:[a-z0-9-]+:iam::[0-9]{12}:oidc-provider/.+$'
  EosEksOidcIssuerHostPath:
    Type: String
    Description: Exact EKS OIDC issuer host/path without https://, copied from describe-cluster.
    AllowedPattern: '^[A-Za-z0-9.-]+/id/[A-Za-z0-9-]+$'
  EosServiceAccountSubject:
    Type: String
    Description: Exact Kubernetes subject, system:serviceaccount:<namespace>:wilsy-eos-api.
    AllowedPattern: '^system:serviceaccount:[a-z0-9-]+:wilsy-eos-api$'
  KeyAdministratorRoleArn:
    Type: String
    Description: Existing dedicated IAM role authorized to administer this KMS key; never the EOS runtime role.
    AllowedPattern: '^arn:[a-z0-9-]+:iam::[0-9]{12}:role/.+$'
Resources:
  GlobalPrincipalMfaKey:
    Type: AWS::KMS::Key
    Properties:
      Description: WILSY EOS Global Principal TOTP envelope encryption
      Enabled: true
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      MultiRegion: false
      PendingWindowInDays: 30
      Tags:
        - Key: Application
          Value: WILSY-EOS
        - Key: Purpose
          Value: GLOBAL_PRINCIPAL_TOTP
        - Key: DataClassification
          Value: AuthenticationSecret
        - Key: ManagedBy
          Value: CloudFormation
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          # Account-root delegation is the standard KMS key-policy mechanism
          # that permits IAM identity policies to authorize key use. Runtime
          # use remains constrained by its exact-key identity policy below.
          - Sid: EnableAccountIamDelegation
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: DedicatedKeyAdministration
            Effect: Allow
            Principal:
              AWS: !Ref KeyAdministratorRoleArn
            Action:
              - kms:CancelKeyDeletion
              - kms:DisableKey
              - kms:EnableKey
              - kms:GetKeyPolicy
              - kms:GetKeyRotationStatus
              - kms:ListResourceTags
              - kms:PutKeyPolicy
              - kms:ScheduleKeyDeletion
              - kms:TagResource
              - kms:UntagResource
              - kms:UpdateKeyDescription
            Resource: '*'

  GlobalPrincipalMfaKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/wilsy/global-principal-mfa
      TargetKeyId: !Ref GlobalPrincipalMfaKey

  EosGlobalMfaRuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: wilsy-eos-global-mfa-runtime
      Description: Dedicated IRSA role for Python EOS Global Principal MFA KMS use only.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument: !Sub
        - |
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Sid": "ExactEosServiceAccountWebIdentity",
              "Effect": "Allow",
              "Principal": {"Federated": "${OidcProviderArn}"},
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {"StringEquals": {
                "${OidcIssuerHostPath}:aud": "sts.amazonaws.com",
                "${OidcIssuerHostPath}:sub": "${ServiceAccountSubject}"
              }}
            }]
          }
        - OidcProviderArn: !Ref EosEksOidcProviderArn
          OidcIssuerHostPath: !Ref EosEksOidcIssuerHostPath
          ServiceAccountSubject: !Ref EosServiceAccountSubject
      Policies:
        - PolicyName: GlobalPrincipalMfaKmsUseOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EncryptDecryptGlobalPrincipalTotpOnly
                Effect: Allow
                Action:
                  - kms:Encrypt
                  - kms:Decrypt
                Resource: !GetAtt GlobalPrincipalMfaKey.Arn
                Condition:
                  StringEquals:
                    kms:EncryptionContext:purpose: GLOBAL_PRINCIPAL_TOTP

Outputs:
  GlobalPrincipalMfaKeyArn:
    Description: Full KMS key ARN for WILSY_GLOBAL_MFA_KMS_KEY_ID.
    Value: !GetAtt GlobalPrincipalMfaKey.Arn
  GlobalPrincipalMfaKeyId:
    Value: !Ref GlobalPrincipalMfaKey
  GlobalPrincipalMfaKeyAlias:
    Value: !Ref GlobalPrincipalMfaKeyAlias
  EosGlobalMfaRuntimeRoleArn:
    Description: Bind this role to the wilsy-eos-api ServiceAccount using the verified EKS IRSA annotation.
    Value: !GetAtt EosGlobalMfaRuntimeRole.Arn
