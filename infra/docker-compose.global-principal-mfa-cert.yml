# Dedicated disposable replica set for Global Principal MFA integration tests.
# Isolated from application MongoDB; uses its own persistent Docker volume.
services:
  global-principal-mfa-cert-mongo:
    image: mongo:7.0
    container_name: wilsy-global-principal-mfa-cert-mongo
    command:
      - mongod
      - --replSet
      - wilsyGlobalPrincipalCertRS
      - --bind_ip_all
      - --port
      - "27019"
    ports:
      - "127.0.0.1:27019:27019"
    volumes:
      - global_principal_mfa_cert_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --host 127.0.0.1 --port 27019 --quiet --eval
          'try { if (rs.status().ok === 1) quit(0); } catch (e) {}
          try { rs.initiate({_id:"wilsyGlobalPrincipalCertRS",members:[{_id:0,host:"127.0.0.1:27019"}]}); } catch (e) {}
          sleep(1000);
          try { quit(rs.status().ok === 1 ? 0 : 1); } catch (e) { quit(1); }'
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped
volumes:
  global_principal_mfa_cert_data:
    name: wilsy_global_principal_mfa_cert_data

