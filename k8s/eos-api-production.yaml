# ==============================================================================
# WILSY OS — DEDICATED PYTHON EOS KUBERNETES PRODUCTION WORKLOAD
#
# TITLE: Dedicated EOS Production Kubernetes Runtime
# SECURITY: digest-pinned, non-root, read-only filesystem, no static AWS keys.
# AUTHORITY: Python EOS owns business and authorization truth; Kubernetes only
#            schedules the workload.
# WORKLOAD IDENTITY: ServiceAccount exists; no AWS role is bound until the
#                    actual cluster/provider identity is independently proven.
# KMS: Optional deployment-owned references only. Empty/missing values keep
#      global MFA KMS disabled. No key ARN, account, region or role is guessed.
# NETWORK: Internal ClusterIP only.
# ==============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: wilsy-eos-api
  labels:
    app.kubernetes.io/name: wilsy-eos-api
    app.kubernetes.io/component: sovereign-api
    app.kubernetes.io/part-of: wilsy-os
automountServiceAccountToken: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wilsy-eos-api
  labels:
    app.kubernetes.io/name: wilsy-eos-api
    app.kubernetes.io/component: sovereign-api
    app.kubernetes.io/part-of: wilsy-os
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wilsy-eos-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wilsy-eos-api
        app.kubernetes.io/component: sovereign-api
        app.kubernetes.io/part-of: wilsy-os
    spec:
      serviceAccountName: wilsy-eos-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eos-api
          image: ghcr.io/mawilis/legal-doc-system/eos-api@sha256:8ff0617d919ddcb4ff6741ddccd892784e51c984f66f9affe0b951a564556d4d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9095
              protocol: TCP
          env:
            - name: WILSY_ENV
              value: production
            # Global-principal MFA KMS is opt-in. These optional references
            # deliberately leave the adapter disabled until the deployment
            # owner provisions every approved value and workload identity.
            - name: WILSY_GLOBAL_MFA_KMS_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: wilsy-eos-runtime
                  key: global-principal-mfa-kms-provider
                  optional: true
            - name: WILSY_GLOBAL_MFA_KMS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: wilsy-eos-runtime
                  key: global-principal-mfa-kms-key-id
                  optional: true
            - name: WILSY_GLOBAL_MFA_KMS_DECRYPT_KEY_IDS
              valueFrom:
                configMapKeyRef:
                  name: wilsy-eos-runtime
                  key: global-principal-mfa-kms-decrypt-key-ids
                  optional: true
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: wilsy-eos-runtime
                  key: global-principal-mfa-kms-region
                  optional: true
            - name: WILSY_HR_DOCUMENT_S3_BUCKET
              value: wilsy-hr-documents-af-south-1-4a5acd714dc2
            - name: WILSY_HR_DOCUMENT_S3_REGION
              value: af-south-1
            - name: WILSY_LEGAL_EVIDENCE_S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: wilsy-eos-runtime
                  key: legal-evidence-s3-bucket
            - name: WILSY_LEGAL_EVIDENCE_S3_REGION
              valueFrom:
                configMapKeyRef:
                  name: wilsy-eos-runtime
                  key: legal-evidence-s3-region
            - name: WILSY_LEGAL_EVIDENCE_S3_KMS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: wilsy-eos-runtime
                  key: legal-evidence-s3-kms-key-id
                  optional: true
            - name: WILSY_LEGAL_EVIDENCE_RECONCILIATION_AWS_ROLE_ARN
              valueFrom:
                configMapKeyRef:
                  name: wilsy-eos-runtime
                  key: legal-evidence-reconciliation-aws-role-arn
            - name: WILSY_LEGAL_EVIDENCE_RECONCILIATION_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: wilsy-eos-runtime-secrets
                  key: legal-evidence-reconciliation-tenant-id
            - name: WILSY_HR_DOCUMENT_MAX_UPLOAD_BYTES
              valueFrom:
                configMapKeyRef:
                  name: wilsy-eos-runtime
                  key: hr-document-max-upload-bytes
            - name: WILSY_HR_DOCUMENT_S3_KMS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: wilsy-eos-runtime
                  key: hr-document-s3-kms-key-id
                  optional: true
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: wilsy-eos-runtime-secrets
                  key: mongodb-uri
            - name: WILSY_INTERNAL_AUTH_SERVICE_ID
              valueFrom:
                secretKeyRef:
                  name: wilsy-eos-runtime-secrets
                  key: internal-auth-service-id
            - name: WILSY_INTERNAL_AUTH_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: wilsy-eos-runtime-secrets
                  key: internal-auth-audience
            - name: WILSY_INTERNAL_AUTH_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: wilsy-eos-runtime-secrets
                  key: internal-auth-key-id
            - name: WILSY_INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: wilsy-eos-runtime-secrets
                  key: internal-auth-secret
            - name: WILSY_LEGAL_EVIDENCE_RECONCILIATION_AUDIT_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: wilsy-eos-runtime-secrets
                  key: legal-evidence-reconciliation-audit-mongodb-uri
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /api/legal-operations/evidence-provider/reconciliation/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: wilsy-eos-api
  labels:
    app.kubernetes.io/name: wilsy-eos-api
    app.kubernetes.io/component: sovereign-api
    app.kubernetes.io/part-of: wilsy-os
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wilsy-eos-api
  ports:
    - name: http
      protocol: TCP
      port: 9095
      targetPort: http

# ==============================================================================
# ARTIFACT SEAL
# KMS values are deployment-owned; optional references do not activate KMS by
# themselves. No AWS role annotation is present pending proof of EKS identity.
# No production key, AWS account, region, credentials or role is fabricated.
# ==============================================================================
