apiVersion: v1
kind: ServiceAccount
metadata:
  name: wilsy-eos-api
  labels:
    app.kubernetes.io/name: wilsy-eos-api
    app.kubernetes.io/component: sovereign-api
    app.kubernetes.io/part-of: wilsy-os
automountServiceAccountToken: true

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wilsy-eos-api
  labels:
    app.kubernetes.io/name: wilsy-eos-api
    app.kubernetes.io/component: sovereign-api
    app.kubernetes.io/part-of: wilsy-os
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wilsy-eos-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wilsy-eos-api
        app.kubernetes.io/component: sovereign-api
        app.kubernetes.io/part-of: wilsy-os
    spec:
      serviceAccountName: wilsy-eos-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: eos-api
          image: ghcr.io/mawilis/legal-doc-system/eos-api@sha256:bee92d39ed1fc1a676fe3cebd132fb31c309e4125b04e24416d12787aef5b180
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9095
              protocol: TCP
          env:
            - name: WILSY_ENV
              value: production
            - name: WILSY_HR_DOCUMENT_S3_BUCKET
              value: wilsy-hr-documents-af-south-1-4a5acd714dc2
            - name: WILSY_HR_DOCUMENT_S3_REGION
              value: af-south-1
            - name: WILSY_HR_DOCUMENT_MAX_UPLOAD_BYTES
              valueFrom:
                configMapKeyRef:
                  name: wilsy-eos-runtime
                  key: hr-document-max-upload-bytes
            - name: WILSY_HR_DOCUMENT_S3_KMS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: wilsy-eos-runtime
                  key: hr-document-s3-kms-key-id
                  optional: true
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: wilsy-eos-runtime-secrets
                  key: mongodb-uri
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: wilsy-eos-api
  labels:
    app.kubernetes.io/name: wilsy-eos-api
    app.kubernetes.io/component: sovereign-api
    app.kubernetes.io/part-of: wilsy-os
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wilsy-eos-api
  ports:
    - name: http
      protocol: TCP
      port: 9095
      targetPort: http

