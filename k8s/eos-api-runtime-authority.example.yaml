# ==============================================================================
# WILSY OS — EOS RUNTIME AUTHORITY CONTRACT EXAMPLE
#
# TITLE: Python EOS Production Runtime Authority Contract
# VERSION: v1.1.0-L10A2R-C4D7-RECONCILIATION-SECRET-CONTRACT
# AUTHORITY: Wilsy OS Core Governance
# PURPOSE:
#   Declare the exact Kubernetes configuration objects required by the certified
#   EOS deployment without embedding production secrets or fabricating values.
#
# IMPORTANT:
#   This file is an example contract only and is deliberately unready until
#   every blank required value is injected by the deployment secret/config path.
#   Never apply this example as production values without completing the blanks.
#   It MUST NOT contain production MONGODB_URI credentials.
#   It MUST NOT invent a production upload ceiling.
#   It MUST NOT grant AWS workload identity authority.
# ==============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: wilsy-eos-runtime
data:
  # REQUIRED.
  #
  # Deployment owner must replace this placeholder with a bounded positive
  # integer chosen as production policy. Test fixture values are not authority.
  hr-document-max-upload-bytes: "REQUIRED_PRODUCTION_POLICY_VALUE"

  # OPTIONAL.
  #
  # Leave empty unless a specific production KMS key has been independently
  # certified. The HR S3 adapter defaults to S3-managed AES256 when omitted.
  hr-document-s3-kms-key-id: ""

  # REQUIRED for the legal-evidence read-only provider composition. Empty values
  # intentionally fail startup validation until the deployment owner selects
  # the actual approved bucket and region. No bucket or IAM authority is guessed.
  legal-evidence-s3-bucket: ""
  legal-evidence-s3-region: ""
  # OPTIONAL only if the approved legal-evidence design uses S3-managed SSE-S3.
  legal-evidence-s3-kms-key-id: ""

---
apiVersion: v1
kind: Secret
metadata:
  name: wilsy-eos-runtime-secrets
type: Opaque
stringData:
  # REQUIRED.
  #
  # Deployment owner must inject the canonical production MONGODB_URI here
  # through the deployment secret mechanism. Do not commit the real URI.
  mongodb-uri: "REQUIRED_PRODUCTION_SECRET"

  # REQUIRED; values must be supplied by the approved internal caller/trust
  # authority and production deployment, never by this example.
  internal-auth-service-id: ""
  internal-auth-audience: ""
  internal-auth-key-id: ""
  internal-auth-secret: ""
  legal-evidence-reconciliation-tenant-id: ""

  # REQUIRED; a separate approved audit deployment URI, with its unique indexes
  # provisioned by the deployment-only audit provisioner before EOS becomes ready.
  legal-evidence-reconciliation-audit-mongodb-uri: ""

# ==============================================================================
# EXTERNAL AUTHORITIES NOT REPRESENTED HERE
#
# 1. AWS workload identity
#    - Dedicated Kubernetes ServiceAccount already exists in eos-api-production.
#    - Bind an AWS runtime role only after the concrete cluster/provider identity
#      mechanism is proven.
#    - Required S3 object actions are exactly:
#        s3:PutObject
#        s3:GetObject
#        s3:AbortMultipartUpload
#    - No ListBucket, bucket administration, or IAM administration authority.
#
# 2. Production MongoDB
#    - MONGODB_URI is deployment authority.
#    - TEST_MONGODB_URI, local MongoDB, and synthetic CI URIs are forbidden.
#
# 3. HR upload policy
#    - Must be a positive decimal integer.
#    - Must be chosen by production deployment authority.
#    - Repository test values are not production policy.
#
# 4. KMS
#    - Optional only.
#    - Do not add KMS IAM actions unless a certified KMS key is configured.
#
